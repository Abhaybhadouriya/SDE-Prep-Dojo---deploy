# Prometheus scrapes (pulls) /metrics from every target every 10 s.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: kafka-exporter        # consumer lag, offsets, partitions
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: shopstream
    static_configs:
      - targets: ["order-api:8000", "enricher:8000", "postgres-sink:8000", "analytics:8000"]

rule_files:
  - /etc/prometheus/alerts.yml
