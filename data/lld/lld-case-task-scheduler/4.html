
  <h2>Class diagram</h2>
  <p>Filled diamond: composition (the scheduler owns its jobs and pool). Hollow diamond: aggregation, a part with its own lifetime that may be shared (one <code>Schedule</code> or <code>Task</code> object can serve many jobs). Dashed line with hollow triangle: implements. Plain arrow: association.</p>
  <figure class="diagram">
    <svg viewBox="0 0 980 680" role="img" aria-label="UML class diagram of the task scheduler">
      <defs>
        <marker id="ts-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="ts-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="ts-fdia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <!-- TaskScheduler -->
      <rect class="box svc" x="20" y="20" width="330" height="300"/>
      <text class="label" x="185" y="42">TaskScheduler</text>
      <path class="line" d="M20 58 H350"/>
      <text class="label mono left" x="30" y="78">- timeQueue : PriorityQueue&lt;Job&gt;</text>
      <text class="label mono left" x="30" y="98">- readyQueue : PriorityQueue&lt;Job&gt;</text>
      <text class="label mono left" x="30" y="118">- jobs : Map&lt;String, Job&gt;</text>
      <text class="label mono left" x="30" y="138">- lock, changed, settled</text>
      <text class="label mono left" x="30" y="158">- freeWorkers : Semaphore</text>
      <text class="label mono left" x="30" y="178">- clock : Clock</text>
      <path class="line" d="M20 190 H350"/>
      <text class="label mono left" x="30" y="210">+ submit(JobSpec)</text>
      <text class="label mono left" x="30" y="230">+ submitGraph(List&lt;JobSpec&gt;)</text>
      <text class="label mono left" x="30" y="250">+ cancel(id) : boolean</text>
      <text class="label mono left" x="30" y="270">+ info(id) : JobInfo</text>
      <text class="label mono left" x="30" y="290">+ awaitTerminal(ids, ms) : boolean</text>
      <text class="label mono left" x="30" y="310">+ shutdown()</text>
      <!-- Job -->
      <rect class="box db" x="420" y="20" width="260" height="200"/>
      <text class="label" x="550" y="42">Job</text>
      <path class="line" d="M420 58 H680"/>
      <text class="label mono left" x="430" y="78">- spec : JobSpec</text>
      <text class="label mono left" x="430" y="98">- state : JobState</text>
      <text class="label mono left" x="430" y="118">- runAt : long</text>
      <text class="label mono left" x="430" y="138">- attempt, runs : int</text>
      <text class="label mono left" x="430" y="158">- pendingDeps : int</text>
      <text class="label mono left" x="430" y="178">- dependents : List&lt;Job&gt;</text>
      <path class="line" d="M420 190 H680"/>
      <text class="label small" x="550" y="210">guarded by the scheduler lock</text>
      <path class="arrow none" d="M352 80 L420 80" style="marker-start:url(#ts-fdia)"/>
      <text class="label small" x="392" y="96">0..*</text>
      <path class="arrow" d="M680 180 L700 180 L700 236 L560 236 L560 226"/>
      <text class="label small" x="720" y="214">dependents</text>
      <!-- JobSpec -->
      <rect class="box cache" x="740" y="20" width="220" height="190"/>
      <text class="label small" x="850" y="36">«immutable»</text>
      <text class="label" x="850" y="54">JobSpec</text>
      <path class="line" d="M740 66 H960"/>
      <text class="label mono left" x="750" y="86">- id : String</text>
      <text class="label mono left" x="750" y="106">- priority : int</text>
      <text class="label mono left" x="750" y="126">- delayMs : long</text>
      <text class="label mono left" x="750" y="146">- dependsOn : Set</text>
      <path class="line" d="M740 158 H960"/>
      <text class="label mono left" x="750" y="178">+ of(id, task) : Builder</text>
      <text class="label mono left" x="750" y="198">+ Builder.build()</text>
      <path class="arrow" d="M682 60 L734 60"/>
      <!-- Task -->
      <rect class="box kafka" x="740" y="270" width="220" height="76"/>
      <text class="label small" x="850" y="286">«interface» Command</text>
      <text class="label" x="850" y="304">Task</text>
      <path class="line" d="M740 316 H960"/>
      <text class="label mono left" x="750" y="336">+ run() throws Exception</text>
      <path class="arrow none" d="M850 212 L850 270" style="marker-start:url(#ts-dia)"/>
      <!-- Schedule -->
      <rect class="box k8s" x="420" y="290" width="260" height="96"/>
      <text class="label small" x="550" y="306">«interface» Strategy</text>
      <text class="label" x="550" y="324">Schedule</text>
      <path class="line" d="M420 336 H680"/>
      <text class="label mono left" x="430" y="356">+ next(planned, finished) : long</text>
      <text class="label mono left" x="430" y="376">+ isRecurring() : boolean</text>
      <path class="arrow none" d="M760 212 L760 250 L600 250 L600 290" style="marker-start:url(#ts-dia)"/>
      <rect class="box k8s" x="410" y="420" width="80" height="40"/><text class="label small" x="450" y="445">Once</text>
      <rect class="box k8s" x="500" y="420" width="90" height="40"/><text class="label small" x="545" y="445">FixedRate</text>
      <rect class="box k8s" x="600" y="420" width="90" height="40"/><text class="label small" x="645" y="445">FixedDelay</text>
      <path class="arrow dashed" d="M450 420 L500 392" style="marker-end:url(#ts-tri)"/>
      <path class="arrow dashed" d="M545 420 L548 392" style="marker-end:url(#ts-tri)"/>
      <path class="arrow dashed" d="M645 420 L600 392" style="marker-end:url(#ts-tri)"/>
      <!-- RetryPolicy -->
      <rect class="box cache" x="740" y="380" width="220" height="90"/>
      <text class="label small" x="850" y="396">«record»</text>
      <text class="label" x="850" y="414">RetryPolicy</text>
      <path class="line" d="M740 426 H960"/>
      <text class="label mono left" x="750" y="446">maxAttempts, baseBackoffMs</text>
      <text class="label mono left" x="750" y="464">+ backoffMs(attempt) : long</text>
      <path class="arrow" d="M940 212 L940 374"/>
      <!-- JobState -->
      <rect class="box client" x="740" y="510" width="220" height="150"/>
      <text class="label small" x="850" y="526">«enum»</text>
      <text class="label" x="850" y="544">JobState</text>
      <path class="line" d="M740 556 H960"/>
      <text class="label mono left" x="750" y="576">WAITING, SCHEDULED,</text>
      <text class="label mono left" x="750" y="596">RUNNING, SUCCEEDED,</text>
      <text class="label mono left" x="750" y="616">FAILED, CANCELLED, SKIPPED</text>
      <path class="line" d="M740 628 H960"/>
      <text class="label mono left" x="750" y="648">+ isTerminal() : boolean</text>
      <path class="arrow" d="M682 100 L712 100 L712 580 L734 580"/>
      <!-- WorkerPool -->
      <rect class="box queue" x="20" y="380" width="330" height="96"/>
      <text class="label" x="185" y="402">WorkerPool</text>
      <path class="line" d="M20 414 H350"/>
      <text class="label mono left" x="30" y="434">- queue : BlockingQueue&lt;Runnable&gt;</text>
      <text class="label mono left" x="30" y="454">+ execute(Runnable)   + shutdownAndJoin()</text>
      <path class="arrow none" d="M120 322 L120 380" style="marker-start:url(#ts-fdia)"/>
      <!-- JobListener + Clock -->
      <rect class="box queue" x="20" y="520" width="330" height="76"/>
      <text class="label small" x="185" y="536">«interface» Observer</text>
      <text class="label" x="185" y="554">JobListener</text>
      <path class="line" d="M20 566 H350"/>
      <text class="label mono left" x="30" y="586">+ onStateChange(id, from, to)</text>
      <path class="arrow" d="M14 300 L8 300 L8 560 L14 560"/>
      <text class="label small left" x="14" y="508">notifies 0..*</text>
      <rect class="box plain" x="420" y="520" width="260" height="76"/>
      <text class="label small" x="550" y="536">«interface»</text>
      <text class="label" x="550" y="554">Clock</text>
      <path class="line" d="M420 566 H680"/>
      <text class="label mono left" x="430" y="586">+ millis() : long  (monotonic)</text>
      <path class="arrow" d="M300 322 L300 350 L380 350 L380 540 L414 540"/>
      <text class="label small" x="185" y="640">JobInfo is a read-only snapshot returned by info(); no client ever holds a Job</text>
    </svg>
    <figcaption>Task scheduler class diagram. The facade owns the mutable world (jobs, queues, pool); everything a client touches (JobSpec, Task, Schedule, RetryPolicy, JobInfo) is immutable or an interface.</figcaption>
  </figure>
