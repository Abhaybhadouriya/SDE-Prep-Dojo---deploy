
  <h2>Class diagram</h2>
  <figure class="diagram">
<svg viewBox="0 0 970 570" role="img" aria-label="UML class diagram: QuickCommerce composes dark stores, orders and products, uses a StoreSelector and a Clock; DarkStore composes StockItems; Order references a DarkStore and an OrderStatus">
<rect class="box k8s" x="20" y="20" width="280" height="70"/><text class="label small" x="160" y="36">&#171;interface&#187;</text><text class="label" x="160" y="54" font-style="italic">StoreSelector</text><line class="line" x1="20" y1="62" x2="300" y2="62"/><text class="label small mono left" x="28" y="80">+ pick(stores, x, y, lines)</text>
<rect class="box svc" x="45" y="150" width="230" height="30"/><text class="label small" x="160" y="170">NearestFullBasketSelector</text>
<path class="arrow dashed" style="marker-end:url(#uml-tri)" d="M160 150 L160 92"/>

<rect class="box svc" x="340" y="20" width="290" height="170"/><text class="label" x="485" y="40">QuickCommerce</text><line class="line" x1="340" y1="50" x2="630" y2="50"/>
<text class="label small mono left" x="348" y="66">- holdMs: long</text><text class="label small mono left" x="348" y="83">- selector; - clock</text><line class="line" x1="340" y1="92" x2="630" y2="92"/>
<text class="label small mono left" x="348" y="108">+ createOrder(c, x, y, lines)</text><text class="label small mono left" x="348" y="125">+ onPayment(id, ok): Status</text><text class="label small mono left" x="348" y="142">+ cancel(id)</text><text class="label small mono left" x="348" y="159">+ sweepExpired(): int</text><text class="label small mono left" x="348" y="176">+ restock(store, sku, q)</text>
<path class="arrow" style="marker-end:url(#uml-open)" d="M340 55 L302 55"/>

<rect class="box k8s" x="690" y="20" width="260" height="70"/><text class="label small" x="820" y="36">&#171;interface&#187;</text><text class="label" x="820" y="54" font-style="italic">Clock</text><line class="line" x1="690" y1="62" x2="950" y2="62"/><text class="label small mono left" x="698" y="80">+ nowMs(): long</text>
<rect class="box svc" x="755" y="150" width="130" height="30"/><text class="label small" x="820" y="170">ManualClock</text>
<path class="arrow dashed" style="marker-end:url(#uml-tri)" d="M820 150 L820 92"/>
<path class="arrow" style="marker-end:url(#uml-open)" d="M630 55 L688 55"/>

<rect class="box svc" x="20" y="260" width="300" height="150"/><text class="label" x="170" y="280">DarkStore</text><line class="line" x1="20" y1="290" x2="320" y2="290"/>
<text class="label small mono left" x="28" y="306">- id; x, y: double (km)</text><text class="label small mono left" x="28" y="323">- stock: Map&lt;sku, StockItem&gt;</text><line class="line" x1="20" y1="332" x2="320" y2="332"/>
<text class="label small mono left" x="28" y="348">+ hasAll(lines): bool</text><text class="label small mono left" x="28" y="365">+ reserveAll(lines): bool</text><text class="label small mono left" x="28" y="382">+ commitAll(lines)</text><text class="label small mono left" x="28" y="399">+ releaseAll(lines)</text>

<rect class="box db" x="20" y="450" width="300" height="100"/><text class="label" x="170" y="470">StockItem</text><line class="line" x1="20" y1="480" x2="320" y2="480"/>
<text class="label small mono left" x="28" y="496">- onHand, reserved: int</text><text class="label small mono left" x="28" y="513">- lock: ReentrantLock</text><line class="line" x1="20" y1="522" x2="320" y2="522"/>
<text class="label small mono left" x="28" y="538">+ /available = onHand - reserved</text>

<rect class="box svc" x="360" y="260" width="280" height="140"/><text class="label" x="500" y="280">Order</text><line class="line" x1="360" y1="290" x2="640" y2="290"/>
<text class="label small mono left" x="368" y="306">- lines: Map&lt;sku, qty&gt;</text><text class="label small mono left" x="368" y="323">- total: int {snapshot}</text><text class="label small mono left" x="368" y="340">- expiresAtMs: long</text><text class="label small mono left" x="368" y="357">- status: OrderStatus</text><line class="line" x1="360" y1="366" x2="640" y2="366"/>
<text class="label small mono left" x="368" y="382">+ moveTo(next): OrderStatus {sync}</text>

<rect class="box db" x="370" y="440" width="260" height="105"/><text class="label small" x="500" y="456">&#171;enumeration&#187;</text><text class="label" x="500" y="473">OrderStatus</text><line class="line" x1="370" y1="481" x2="630" y2="481"/>
<text class="label small mono left" x="378" y="497">CREATED CONFIRMED PACKED</text><text class="label small mono left" x="378" y="514">OUT_FOR_DELIVERY DELIVERED</text><text class="label small mono left" x="378" y="531">CANCELLED EXPIRED</text>

<rect class="box svc" x="690" y="260" width="260" height="60"/><text class="label" x="820" y="280">Product</text><line class="line" x1="690" y1="290" x2="950" y2="290"/><text class="label small mono left" x="698" y="308">- sku, name; - price: int</text>

<path class="arrow" style="marker-start:url(#uml-dia-f);marker-end:none" d="M370 190 L370 225 L170 225 L170 258"/><text class="label small left" x="177" y="250">*</text>
<path class="arrow" style="marker-start:url(#uml-dia-f);marker-end:none" d="M500 190 L500 258"/><text class="label small left" x="507" y="250">*</text>
<path class="arrow" style="marker-start:url(#uml-dia-f);marker-end:none" d="M610 190 L610 225 L820 225 L820 258"/><text class="label small left" x="827" y="250">* catalog</text>
<path class="arrow" style="marker-start:url(#uml-dia-f);marker-end:none" d="M170 410 L170 448"/><text class="label small left" x="177" y="440">* (one per SKU)</text>
<path class="arrow" style="marker-end:url(#uml-open)" d="M360 330 L322 330"/><text class="label small" x="341" y="322">1</text>
<path class="arrow" style="marker-end:url(#uml-open)" d="M500 400 L500 438"/>
<text class="label small left" x="690" y="360">StockItem.sku and Order.lines</text><text class="label small left" x="690" y="378">refer to Product by SKU key,</text><text class="label small left" x="690" y="396">not by object reference.</text>
</svg>
<figcaption>QuickCommerce is the facade. Stock lives in StockItem, one per (DarkStore, SKU), each with its own lock. Order points to the store that holds its reservation, so release and commit always hit the right counters.</figcaption>
</figure>
  <p>The order lifecycle. CREATED is the only state that holds a <em>reservation</em>; CONFIRMED and PACKED hold <em>deducted</em> stock, which a cancel must return to the shelf.</p>
  <figure class="diagram">
<svg viewBox="0 0 900 250" role="img" aria-label="Order state machine: CREATED to CONFIRMED to PACKED to OUT_FOR_DELIVERY to DELIVERED; CREATED can also go to EXPIRED or CANCELLED; CONFIRMED and PACKED can go to CANCELLED">
<rect class="box client" x="10" y="40" width="130" height="50" rx="24"/><text class="label" x="75" y="70">CREATED</text>
<rect class="box svc" x="190" y="40" width="140" height="50" rx="24"/><text class="label" x="260" y="70">CONFIRMED</text>
<rect class="box k8s" x="380" y="40" width="120" height="50" rx="24"/><text class="label" x="440" y="70">PACKED</text>
<rect class="box queue" x="550" y="40" width="170" height="50" rx="24"/><text class="label" x="635" y="70">OUT_FOR_DELIVERY</text>
<rect class="box db" x="760" y="40" width="130" height="50" rx="24"/><text class="label" x="825" y="70">DELIVERED</text>
<rect class="box cache" x="10" y="180" width="130" height="50" rx="24"/><text class="label" x="75" y="210">EXPIRED</text>
<rect class="box cache" x="300" y="180" width="140" height="50" rx="24"/><text class="label" x="370" y="210">CANCELLED</text>
<path class="arrow" d="M140 65 L188 65"/><path class="arrow" d="M330 65 L378 65"/><path class="arrow" d="M500 65 L548 65"/><path class="arrow" d="M720 65 L758 65"/>
<path class="arrow" d="M75 90 L75 178"/><path class="arrow" d="M110 90 L320 178"/><path class="arrow" d="M260 90 L350 178"/><path class="arrow" d="M440 90 L400 178"/>
<text class="label small" x="164" y="30">paid: commit</text><text class="label small" x="354" y="30">pack</text><text class="label small" x="524" y="30">rider</text><text class="label small" x="739" y="30">done</text>
<text class="label small left" x="82" y="150">timeout: release</text>
<text class="label small left" x="460" y="150">from CREATED: release reservation</text>
<text class="label small left" x="460" y="168">from CONFIRMED / PACKED: return to shelf</text>
<text class="label small left" x="460" y="186">(no cancel once out for delivery)</text>
</svg>
<figcaption>Every arrow is one row in <code>OrderStatus.canMoveTo</code>. The inventory side effect depends on the state you leave, which is why <code>moveTo</code> returns the old status.</figcaption>
</figure>
