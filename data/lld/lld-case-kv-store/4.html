
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 980 600" role="img" aria-label="UML class diagram of the key-value store">
      <defs>
        <marker id="kv-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="kv-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="kv-fdia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <!-- interface -->
      <rect class="box k8s" x="330" y="20" width="320" height="150"/>
      <text class="label small" x="490" y="38">«interface»</text>
      <text class="label" x="490" y="56">KeyValueStore</text>
      <path class="line" d="M330 66 H650"/>
      <path class="line" d="M330 72 H650"/>
      <text class="label mono left" x="342" y="92">+ get(k) : Optional&lt;String&gt;</text>
      <text class="label mono left" x="342" y="112">+ set(k, v) / set(k, v, ttl)</text>
      <text class="label mono left" x="342" y="132">+ delete(k) / expire(k, ttl)</text>
      <text class="label mono left" x="342" y="152">+ ttlMillis(k) : long</text>
      <!-- store -->
      <rect class="box svc" x="40" y="230" width="380" height="250"/>
      <text class="label" x="230" y="252">InMemoryStore</text>
      <path class="line" d="M40 264 H420"/>
      <text class="label mono left" x="52" y="284">- data : Map&lt;String, Entry&gt;</text>
      <text class="label mono left" x="52" y="304">- expiries : PriorityQueue&lt;ExpiryRef&gt;</text>
      <text class="label mono left" x="52" y="324">- rw : ReentrantReadWriteLock</text>
      <text class="label mono left" x="52" y="344">- clock : Clock, listeners</text>
      <path class="line" d="M40 356 H420"/>
      <text class="label mono left" x="52" y="376">+ session() : Session</text>
      <text class="label mono left" x="52" y="396">+ purgeExpired(max) : int</text>
      <text class="label mono left" x="52" y="416">+ size() : int</text>
      <text class="label mono left" x="52" y="436">+ snapshot() : Snapshot / restore(s)</text>
      <text class="label mono left" x="52" y="456">~ commit(readVersions, writes)</text>
      <text class="label mono left" x="52" y="474">~ read(k) : Entry</text>
      <path class="arrow dashed" d="M230 230 L420 176" style="marker-end:url(#kv-tri)"/>
      <!-- session -->
      <rect class="box cache" x="560" y="230" width="380" height="190"/>
      <text class="label" x="750" y="252">Session</text>
      <path class="line" d="M560 264 H940"/>
      <text class="label mono left" x="572" y="284">- store : InMemoryStore</text>
      <text class="label mono left" x="572" y="304">- layers : Deque&lt;Map&lt;String, Entry&gt;&gt;</text>
      <text class="label mono left" x="572" y="324">- readVersions : Map&lt;String, Long&gt;</text>
      <path class="line" d="M560 336 H940"/>
      <text class="label mono left" x="572" y="356">+ begin() / commit() / rollback()</text>
      <text class="label mono left" x="572" y="376">+ depth() : int</text>
      <text class="label mono left" x="572" y="396">- visible(k) : Entry</text>
      <path class="arrow dashed" d="M750 230 L560 176" style="marker-end:url(#kv-tri)"/>
      <path class="arrow" d="M560 330 L426 330"/>
      <text class="label small" x="494" y="320">uses</text>
      <!-- entry, ref, snapshot -->
      <rect class="box db" x="40" y="520" width="200" height="66"/><text class="label small" x="140" y="538">«record» Entry</text><text class="label mono" x="140" y="558">value, expiresAt,</text><text class="label mono" x="140" y="576">version</text>
      <rect class="box queue" x="260" y="520" width="200" height="66"/><text class="label small" x="360" y="538">«record» ExpiryRef</text><text class="label mono" x="360" y="558">expiresAt, key,</text><text class="label mono" x="360" y="576">version</text>
      <rect class="box client" x="480" y="470" width="200" height="66"/><text class="label small" x="580" y="488">«memento»</text><text class="label" x="580" y="508">Snapshot</text><text class="label mono" x="580" y="526">private copy</text>
      <rect class="box kafka" x="700" y="470" width="120" height="56"/><text class="label small" x="760" y="490">«interface»</text><text class="label small" x="760" y="510">Clock</text>
      <rect class="box kafka" x="830" y="470" width="130" height="56"/><text class="label small" x="895" y="490">«interface»</text><text class="label small" x="895" y="510">ExpiryListener</text>
      <path class="arrow none" d="M140 482 L140 520" style="marker-start:url(#kv-fdia)"/>
      <path class="arrow none" d="M360 482 L360 520" style="marker-start:url(#kv-fdia)"/>
      <path class="arrow dashed" d="M422 450 L474 490"/>
      <text class="label small" x="452" y="456">creates</text>
      <path class="arrow" d="M422 344 L520 344 L520 440 L760 440 L760 464"/>
      <path class="arrow" d="M760 440 L895 440 L895 464"/>
    </svg>
    <figcaption>Both the store and a session implement the same interface. The store owns the data, the heap and the lock; a session owns only its private layers and the versions it has read. Snapshot is a nested class with private state: only the store can read it.</figcaption>
  </figure>
