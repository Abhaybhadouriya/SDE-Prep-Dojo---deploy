
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 960 660" role="img" aria-label="UML class diagram for the shopping cart: ShopService owns carts, inventory and coupons; a Coupon has a Rule and a DiscountStrategy; CouponLayer decorates PriceCalculator and produces a Bill">
      <defs>
        <marker id="sc-cd-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="sc-cd-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <rect class="box svc" x="290" y="20" width="340" height="170"/>
      <text class="label big" x="460" y="44">ShopService</text>
      <path class="arrow none" d="M290 58 L630 58"/>
      <text class="label mono left" x="302" y="80">+ addItem(user, productId, qty)</text>
      <text class="label mono left" x="302" y="100">+ updateQty / removeItem</text>
      <text class="label mono left" x="302" y="120">+ applyCoupon(user, code)</text>
      <text class="label mono left" x="302" y="140">+ price(user) : Bill</text>
      <text class="label mono left" x="302" y="160">+ checkout(user) : Order</text>
      <text class="label small" x="460" y="180">facade; lock order cart then inventory</text>

      <rect class="box client" x="20" y="20" width="200" height="130"/>
      <text class="label big" x="120" y="44">Cart</text>
      <path class="arrow none" d="M20 58 L220 58"/>
      <text class="label mono left" x="32" y="80">userId</text>
      <text class="label mono left" x="32" y="100">- lines : Map</text>
      <text class="label mono left" x="32" y="120">- coupons : Set&lt;code&gt;</text>
      <text class="label small" x="120" y="140">synchronized</text>
      <path class="arrow none" d="M290 90 L222 90" style="marker-start:url(#sc-cd-dia)"/>
      <text class="label small" x="256" y="80">0..*</text>

      <rect class="box db" x="700" y="20" width="240" height="110"/>
      <text class="label big" x="820" y="44">Inventory</text>
      <path class="arrow none" d="M700 58 L940 58"/>
      <text class="label mono left" x="712" y="80">- stock : Map&lt;id,int&gt;</text>
      <text class="label mono left" x="712" y="100">+ reserveAll(want)</text>
      <text class="label small" x="820" y="120">check all, then decrement</text>
      <path class="arrow none" d="M630 75 L698 75" style="marker-start:url(#sc-cd-dia)"/>

      <rect class="box client" x="20" y="200" width="200" height="70"/>
      <text class="label big" x="120" y="222">CartLine</text>
      <text class="label mono" x="120" y="250">product, qty, total()</text>
      <path class="arrow none" d="M120 150 L120 198" style="marker-start:url(#sc-cd-dia)"/>

      <rect class="box svc" x="20" y="320" width="200" height="90"/>
      <text class="label big" x="120" y="344">Product</text>
      <path class="arrow none" d="M20 358 L220 358"/>
      <text class="label mono left" x="32" y="378">id, name, category</text>
      <text class="label mono left" x="32" y="398">pricePaise</text>
      <path class="arrow" d="M120 270 L120 316"/>

      <rect class="box plain" x="20" y="470" width="200" height="90"/>
      <text class="label big" x="120" y="494">Order</text>
      <path class="arrow none" d="M20 508 L220 508"/>
      <text class="label mono left" x="32" y="528">id, userId, lines</text>
      <text class="label mono left" x="32" y="548">bill : Bill</text>
      <path class="arrow dashed" d="M300 190 L200 466"/>
      <text class="label small" x="262" y="420">creates</text>

      <rect class="box cache" x="290" y="250" width="340" height="120"/>
      <text class="label big" x="460" y="274">Coupon</text>
      <path class="arrow none" d="M290 288 L630 288"/>
      <text class="label mono left" x="302" y="308">code, priority, stackable</text>
      <text class="label mono left" x="302" y="328">maxUsesPerUser</text>
      <text class="label mono left" x="302" y="348">+ whyNot(ctx) : Optional&lt;String&gt;</text>
      <path class="arrow none" d="M460 190 L460 248" style="marker-start:url(#sc-cd-dia)"/>
      <text class="label small" x="490" y="224">0..*</text>

      <rect class="box cache" x="700" y="180" width="240" height="110"/>
      <text class="label small" x="820" y="198">&#171;interface&#187; Specification</text>
      <text class="label big" x="820" y="220">Rule</text>
      <text class="label mono left" x="712" y="244">+ violation(ctx)</text>
      <text class="label mono left" x="712" y="264">+ and(other) : Rule</text>
      <text class="label small" x="820" y="282">minSubtotal, hasCategory, ...</text>
      <path class="arrow" d="M630 290 L696 262"/>

      <rect class="box cache" x="290" y="430" width="340" height="70"/>
      <text class="label small" x="460" y="450">&#171;interface&#187;</text>
      <text class="label big" x="460" y="470">DiscountStrategy</text>
      <text class="label mono" x="460" y="492">+ discount(ctx, running) : long</text>
      <path class="arrow" d="M460 370 L460 426"/>

      <rect class="box cache" x="250" y="570" width="120" height="60"/><text class="label" x="310" y="594">FlatOff</text><text class="label small" x="310" y="616">min(X, running)</text>
      <rect class="box cache" x="390" y="570" width="140" height="60"/><text class="label" x="460" y="594">PercentOff</text><text class="label small" x="460" y="616">bp, optional cap</text>
      <rect class="box cache" x="550" y="570" width="150" height="60"/><text class="label" x="625" y="594">CategoryPercent</text><text class="label small" x="625" y="616">one category only</text>
      <path class="arrow dashed" d="M310 570 L420 504" style="marker-end:url(#sc-cd-tri)"/>
      <path class="arrow dashed" d="M460 570 L460 504" style="marker-end:url(#sc-cd-tri)"/>
      <path class="arrow dashed" d="M625 570 L500 504" style="marker-end:url(#sc-cd-tri)"/>

      <rect class="box svc" x="720" y="340" width="220" height="70"/>
      <text class="label small" x="830" y="360">&#171;interface&#187;</text>
      <text class="label big" x="830" y="380">PriceCalculator</text>
      <text class="label mono" x="830" y="400">+ calculate(ctx) : Bill</text>

      <rect class="box svc" x="720" y="460" width="95" height="50"/><text class="label small" x="767" y="490">BasePrice</text>
      <rect class="box svc" x="835" y="460" width="105" height="60"/><text class="label small" x="887" y="482">CouponLayer</text><text class="label small" x="887" y="504">inner, coupon</text>
      <path class="arrow dashed" d="M767 460 L800 414" style="marker-end:url(#sc-cd-tri)"/>
      <path class="arrow dashed" d="M870 460 L850 414" style="marker-end:url(#sc-cd-tri)"/>
      <path class="arrow" d="M930 460 C 950 440, 950 400, 942 385"/>
      <text class="label small" x="912" y="440">wraps</text>
      <path class="arrow dashed" d="M835 470 L634 350"/>
      <text class="label small" x="700" y="425">uses</text>

      <rect class="box plain" x="720" y="560" width="220" height="80"/>
      <text class="label big" x="830" y="584">Bill</text>
      <path class="arrow none" d="M720 598 L940 598"/>
      <text class="label mono left" x="732" y="618">subtotal, discounts, notes</text>
      <text class="label small" x="830" y="634">immutable; total()</text>
    </svg>
    <figcaption>Filled diamonds are composition (the service owns carts, inventory and coupons; a cart owns its lines). Solid arrows are associations. Dashed lines with hollow triangles are "implements". <code>CouponLayer</code> both implements <code>PriceCalculator</code> and wraps another one: that pair of arrows is the signature of a Decorator.</figcaption>
  </figure>
