
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 900 600" role="img" aria-label="UML class diagram of the news feed: SocialNetwork facade uses PostStore, FollowGraph, FeedGenerator and FeedRanker; Pull, Push and Global generators implement FeedGenerator; Push also implements FeedListener; Post and Comment extend Votable">
      <defs>
        <marker id="nf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker>
        <marker id="nf-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="nf-diamond" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <rect class="box client" x="20" y="20" width="170" height="80"/>
      <text class="label big" x="105" y="46">Console</text>
      <text class="label mono" x="105" y="70">- current user</text>
      <text class="label mono" x="105" y="90">+ run("post~hi")</text>

      <rect class="box svc" x="260" y="20" width="330" height="190"/>
      <text class="label small" x="425" y="38">Facade</text>
      <text class="label big" x="425" y="60">SocialNetwork</text>
      <path class="arrow none" d="M260 70 L590 70"/>
      <text class="label mono" x="425" y="92">- rankerOf : Map&lt;user, FeedRanker&gt;</text>
      <text class="label mono" x="425" y="112">- listeners : List&lt;FeedListener&gt;</text>
      <path class="arrow none" d="M260 122 L590 122"/>
      <text class="label mono" x="425" y="144">+ signup follow unfollow post</text>
      <text class="label mono" x="425" y="164">+ comment reply votePost delete</text>
      <text class="label mono" x="425" y="184">+ setRanking(user, ranker)</text>
      <text class="label mono" x="425" y="204">+ feed(user, size, cursor)</text>

      <rect class="box db" x="640" y="20" width="240" height="90"/>
      <text class="label big" x="760" y="46">PostStore</text>
      <text class="label mono" x="760" y="70">byId, timelines(author)</text>
      <text class="label mono" x="760" y="92">+ timeline(a) + recent(n)</text>
      <rect class="box db" x="640" y="130" width="240" height="80"/>
      <text class="label big" x="760" y="156">FollowGraph</text>
      <text class="label mono" x="760" y="180">following, followers</text>
      <text class="label mono" x="760" y="200">+ follows(a, b)</text>

      <rect class="box queue" x="20" y="260" width="260" height="80"/>
      <text class="label small" x="150" y="280">«interface» Strategy 1</text>
      <text class="label big" x="150" y="302">FeedGenerator</text>
      <text class="label mono" x="150" y="326">candidates(user, limit)</text>
      <rect class="box queue" x="330" y="260" width="230" height="80"/>
      <text class="label small" x="445" y="280">«interface» Strategy 2</text>
      <text class="label big" x="445" y="302">FeedRanker</text>
      <text class="label mono" x="445" y="326">order(viewer, graph)</text>
      <rect class="box queue" x="610" y="260" width="270" height="80"/>
      <text class="label small" x="745" y="280">«interface» Observer</text>
      <text class="label big" x="745" y="302">FeedListener</text>
      <text class="label mono" x="745" y="326">onPost(p) onFollow(a, b)</text>

      <rect class="box cache" x="20" y="400" width="120" height="50"/><text class="label" x="80" y="430">Pull</text>
      <rect class="box cache" x="150" y="400" width="120" height="50"/><text class="label" x="210" y="430">Global</text>
      <rect class="box cache" x="470" y="400" width="300" height="60"/><text class="label" x="620" y="424">PushFeedGenerator</text><text class="label mono" x="620" y="446">inbox : Map&lt;user, Deque&lt;Post&gt;&gt;</text>
      <rect class="box cache" x="300" y="400" width="140" height="60"/><text class="label small" x="370" y="420">«enum»</text><text class="label" x="370" y="444">Rankers</text>

      <rect class="box k8s" x="300" y="500" width="160" height="80"/>
      <text class="label small" x="380" y="520">«abstract»</text>
      <text class="label big" x="380" y="542">Votable</text>
      <text class="label mono" x="380" y="566">vote(user, dir) score()</text>
      <rect class="box k8s" x="520" y="510" width="150" height="70"/><text class="label big" x="595" y="538">Post</text><text class="label mono" x="595" y="562">comments 0..*</text>
      <rect class="box k8s" x="700" y="510" width="170" height="70"/><text class="label big" x="785" y="538">Comment</text><text class="label mono" x="785" y="562">replies 0..*</text>

      <path class="arrow" d="M190 60 L254 60" style="marker-end:url(#nf-arrow)"/>
      <path class="arrow none" d="M590 60 L634 60" style="marker-start:url(#nf-diamond);marker-end:url(#nf-arrow)"/>
      <path class="arrow none" d="M590 170 L634 170" style="marker-start:url(#nf-diamond);marker-end:url(#nf-arrow)"/>
      <path class="arrow" d="M300 210 L170 254" style="marker-end:url(#nf-arrow)"/>
      <path class="arrow" d="M425 210 L445 254" style="marker-end:url(#nf-arrow)"/>
      <path class="arrow" d="M560 210 L700 254" style="marker-end:url(#nf-arrow)"/>
      <path class="arrow dashed none" d="M80 400 L80 346" style="marker-end:url(#nf-tri)"/>
      <path class="arrow dashed none" d="M210 400 L210 346" style="marker-end:url(#nf-tri)"/>
      <path class="arrow dashed none" d="M500 400 L500 370 L250 370 L250 346" style="marker-end:url(#nf-tri)"/>
      <path class="arrow dashed none" d="M720 400 L720 346" style="marker-end:url(#nf-tri)"/>
      <path class="arrow dashed none" d="M370 400 L410 346" style="marker-end:url(#nf-tri)"/>
      <path class="arrow dashed none" d="M520 545 L466 545" style="marker-end:url(#nf-tri)"/>
      <path class="arrow dashed none" d="M700 590 L380 590 L380 586" style="marker-end:url(#nf-tri)"/>
    </svg>
    <figcaption>Three interfaces carry the design: <code>FeedGenerator</code> (which posts), <code>FeedRanker</code> (what order) and <code>FeedListener</code> (who hears about new posts). <code>PushFeedGenerator</code> is both a generator and a listener: it fills inboxes when told about posts. Filled diamonds: the facade owns its stores. Hollow triangles: implements or extends.</figcaption>
  </figure>
