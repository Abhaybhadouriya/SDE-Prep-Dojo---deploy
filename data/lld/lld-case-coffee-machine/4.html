
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 900 560" role="img" aria-label="UML class diagram: CoffeeMachine has a BeverageFactory, an Inventory and a Brewer; Beverage interface is implemented by BaseBeverage and the AddOn decorator, which wraps another Beverage; ExtraShot, ExtraMilk, Sugar and Caramel extend AddOn; Inventory notifies LowStockListeners">
      <defs>
        <marker id="cm-cd-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="cm-cd-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <rect class="box svc" x="20" y="20" width="300" height="170"/>
      <text class="label big" x="170" y="44">CoffeeMachine</text>
      <path class="arrow none" d="M20 56 L320 56"/>
      <text class="label small mono left" x="32" y="76">- outlets : ExecutorService(N)</text>
      <text class="label small mono left" x="32" y="95">- peakBusy, revenue : Atomic</text>
      <path class="arrow none" d="M20 106 L320 106"/>
      <text class="label small mono left" x="32" y="126">+ order(drink, extras..)</text>
      <text class="label small mono left" x="32" y="145">     : Future&lt;Result&gt;</text>
      <text class="label small mono left" x="32" y="164">- pour(b) : Result</text>
      <text class="label small" x="170" y="182">reserve now, brew on a free outlet</text>

      <rect class="box cache" x="350" y="20" width="250" height="130"/>
      <text class="label big" x="475" y="44">BeverageFactory</text>
      <path class="arrow none" d="M350 56 L600 56"/>
      <text class="label small mono left" x="362" y="76">- menu : name -&gt; Beverage</text>
      <text class="label small mono left" x="362" y="95">- addOns : name -&gt; wrap fn</text>
      <path class="arrow none" d="M350 106 L600 106"/>
      <text class="label small mono left" x="362" y="126">+ register..(); create(..)</text>
      <path class="arrow none" d="M320 70 L348 70" style="marker-start:url(#cm-cd-dia)"/>

      <rect class="box svc" x="640" y="20" width="240" height="100"/>
      <text class="label small" x="760" y="38">«interface»</text>
      <text class="label big" x="760" y="60">Beverage</text>
      <path class="arrow none" d="M640 72 L880 72"/>
      <text class="label small mono" x="760" y="92">name() price() recipe()</text>
      <path class="arrow dashed" d="M600 80 L636 80"/>

      <rect class="box plain" x="560" y="200" width="140" height="64"/>
      <text class="label" x="630" y="222">BaseBeverage</text>
      <text class="label small mono" x="630" y="246">name, price</text>
      <path class="arrow dashed" d="M650 200 L715 124" style="marker-end:url(#cm-cd-tri)"/>

      <rect class="box cache" x="730" y="200" width="160" height="90"/>
      <text class="label small" x="810" y="218">«decorator»</text>
      <text class="label" x="810" y="238">AddOn</text>
      <text class="label small mono" x="810" y="260">- inner : Beverage</text>
      <text class="label small mono" x="810" y="280">label, +price, +parts</text>
      <path class="arrow dashed" d="M790 200 L780 124" style="marker-end:url(#cm-cd-tri)"/>
      <path class="arrow none" d="M870 198 L870 122" style="marker-start:url(#cm-cd-dia)"/>
      <text class="label small left" x="876" y="166">1</text>

      <rect class="box plain" x="545" y="330" width="125" height="64"/>
      <text class="label" x="607" y="352">Recipe</text>
      <text class="label small mono" x="607" y="376">immutable map</text>
      <path class="arrow none" d="M607 266 L607 328" style="marker-start:url(#cm-cd-dia)"/>

      <rect class="box plain" x="560" y="470" width="78" height="44"/><text class="label small" x="599" y="496">ExtraShot</text>
      <rect class="box plain" x="644" y="470" width="78" height="44"/><text class="label small" x="683" y="496">ExtraMilk</text>
      <rect class="box plain" x="728" y="470" width="78" height="44"/><text class="label small" x="767" y="496">Sugar</text>
      <rect class="box plain" x="812" y="470" width="78" height="44"/><text class="label small" x="851" y="496">Caramel</text>
      <path class="arrow" d="M599 470 L790 294" style="marker-end:url(#cm-cd-tri)"/>
      <path class="arrow" d="M683 470 L800 294" style="marker-end:url(#cm-cd-tri)"/>
      <path class="arrow" d="M767 470 L810 294" style="marker-end:url(#cm-cd-tri)"/>
      <path class="arrow" d="M851 470 L820 294" style="marker-end:url(#cm-cd-tri)"/>

      <rect class="box db" x="20" y="250" width="300" height="150"/>
      <text class="label big" x="170" y="274">Inventory</text>
      <path class="arrow none" d="M20 286 L320 286"/>
      <text class="label small mono left" x="32" y="306">- stock, lowMark : name -&gt; int</text>
      <text class="label small mono left" x="32" y="325">- listeners : List</text>
      <path class="arrow none" d="M20 336 L320 336"/>
      <text class="label small mono left" x="32" y="356">+ tryReserve(recipe) : problems</text>
      <text class="label small mono left" x="32" y="375">+ release, refill, level</text>
      <text class="label small mono left" x="32" y="394">+ lowIngredients()</text>
      <path class="arrow none" d="M170 190 L170 248" style="marker-start:url(#cm-cd-dia)"/>
      <path class="arrow dashed" d="M320 360 L541 360"/>
      <text class="label small" x="440" y="352">uses</text>

      <rect class="box cache" x="350" y="200" width="180" height="70"/>
      <text class="label small" x="440" y="220">«interface»</text>
      <text class="label" x="440" y="240">Brewer</text>
      <text class="label small mono" x="440" y="260">brew(beverage)</text>
      <path class="arrow none" d="M300 190 L360 200" style="marker-start:url(#cm-cd-dia)"/>

      <rect class="box plain" x="350" y="420" width="180" height="60"/>
      <text class="label" x="440" y="442">Result</text>
      <text class="label small mono" x="440" y="464">drink, served, detail</text>
      <path class="arrow dashed" d="M322 175 C 338 300, 340 380, 380 418"/>

      <rect class="box cache" x="20" y="450" width="300" height="70"/>
      <text class="label small" x="170" y="470">«interface»</text>
      <text class="label" x="170" y="490">LowStockListener</text>
      <text class="label small mono" x="170" y="510">onLow(ingredient, left)</text>
      <path class="arrow none" d="M170 402 L170 448" style="marker-start:url(#cm-cd-dia)"/>
    </svg>
    <figcaption>Two halves. On the right, the drink model: Beverage is the interface, BaseBeverage holds a recipe, AddOn implements Beverage and also holds one Beverage (the diamond back up to the interface): that "is-a and has-a the same type" shape is the Decorator. On the left, the machine: it owns a factory, an inventory, a brewer and a pool of N outlet threads. The indicator is a LowStockListener subscribed to the inventory. Dashed open arrows mean "creates" or "uses".</figcaption>
  </figure>
  <p>Why the <b>diamond from AddOn back to Beverage</b> matters: because the add-on holds "some Beverage", not "a base drink", it can hold another add-on. That is what lets you stack <code>Caramel(ExtraShot(Espresso))</code> to any depth.</p>
