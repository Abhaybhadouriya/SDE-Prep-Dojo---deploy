
  <h2>Class diagram</h2>

        <marker id="snk-cd-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>

      <rect class="box svc" x="240" y="20" width="380" height="230"/>

      <rect class="box db" x="20" y="20" width="180" height="120"/>

      <path class="arrow none" d="M660 126 L980 126"/>
      <text class="label mono left" x="672" y="146">+ head(), tail(), grow(n)</text>

      <path class="arrow none" d="M620 80 L658 80" style="marker-start:url(#snk-cd-dia)"/>

      <text class="label mono" x="110" y="232">dr, dc, isOpposite</text>

      <path class="arrow" d="M620 240 L890 328"/>

      <rect class="box cache" x="440" y="460" width="170" height="56"/><text class="label" x="525" y="483">FixedFoodSpawner</text><text class="label small" x="525" y="504">LeetCode list</text>
      <rect class="box cache" x="440" y="540" width="170" height="56"/><text class="label" x="525" y="563">RandomFoodSpawner</text><text class="label small" x="525" y="584">seeded</text>
      <rect class="box cache" x="630" y="460" width="170" height="44"/><text class="label" x="715" y="487">FoodGrowth</text>
      <rect class="box cache" x="630" y="540" width="170" height="56"/><text class="label" x="715" y="563">EveryNTicksGrowth</text><text class="label small" x="715" y="584">follow-up</text>
      <path class="arrow dashed" d="M325 460 L325 404" style="marker-end:url(#snk-cd-tri)"/>
      <path class="arrow dashed" d="M230 568 C 190 520, 200 440, 262 404" style="marker-end:url(#snk-cd-tri)"/>
      <path class="arrow dashed" d="M525 460 L525 404" style="marker-end:url(#snk-cd-tri)"/>
      <path class="arrow dashed" d="M610 568 C 625 520, 615 450, 585 404" style="marker-end:url(#snk-cd-tri)"/>
      <path class="arrow dashed" d="M715 460 L715 404" style="marker-end:url(#snk-cd-tri)"/>
      <path class="arrow dashed" d="M800 568 C 830 520, 820 450, 778 404" style="marker-end:url(#snk-cd-tri)"/>
    </svg>
    <figcaption>Filled diamonds: Game owns its board, snake and three rule objects. Dashed lines with hollow triangles: "implements". Game knows nothing about pixels or keyboards; GameLoop knows nothing about rules; Snake knows nothing about walls or food.</figcaption>
  </figure>
  <p>Each class has one reason to change (<a href="{{BASE}}lld/lld-prin-srp">SRP</a>). The snake changes only if its storage changes. A rule class changes when that rule changes. <code>Game</code> changes only when the order of a tick changes. That is why the follow-ups in <a href="#extensibility">extensibility</a> are one new class each.</p>
