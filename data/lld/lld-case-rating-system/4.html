
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 900 520" role="img" aria-label="UML class diagram: RatingService holds all-time and per-month maps of Stats, produces AgentScore rows, sorts them with a Comparator ranking policy from Rankings, and uses the Exporter interface implemented by CsvExporter and JsonExporter">
      <defs>
        <marker id="rs-cd-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="rs-cd-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <rect class="box svc" x="280" y="20" width="340" height="190"/>
      <text class="label big" x="450" y="44">RatingService</text>
      <path class="arrow none" d="M280 58 L620 58"/>
      <text class="label mono left" x="292" y="78">- allTime : Map&lt;agent, Stats&gt;</text>
      <text class="label mono left" x="292" y="98">- byMonth : Map&lt;YearMonth, Map&lt;agent, Stats&gt;&gt;</text>
      <text class="label mono left" x="292" y="118">- ranking : Comparator&lt;AgentScore&gt;</text>
      <path class="arrow none" d="M280 128 L620 128"/>
      <text class="label mono left" x="292" y="148">+ rate(agent, stars, date)</text>
      <text class="label mono left" x="292" y="168">+ averages() / bestOfMonth(m) / topAgents(m)</text>
      <text class="label mono left" x="292" y="188">+ export(rows, Exporter) : String</text>

      <rect class="box db" x="20" y="40" width="200" height="110"/>
      <text class="label big" x="120" y="64">Stats</text>
      <path class="arrow none" d="M20 78 L220 78"/>
      <text class="label mono left" x="32" y="98">sum : long, count : long</text>
      <text class="label mono left" x="32" y="118">plus(stars) : Stats</text>
      <text class="label small" x="120" y="140">immutable value</text>
      <path class="arrow none" d="M280 100 L222 100" style="marker-start:url(#rs-cd-dia)"/>
      <text class="label small" x="250" y="90">0..*</text>

      <rect class="box client" x="20" y="260" width="240" height="120"/>
      <text class="label big" x="140" y="284">AgentScore</text>
      <path class="arrow none" d="M20 298 L260 298"/>
      <text class="label mono left" x="32" y="318">agentId, sum, count</text>
      <text class="label mono left" x="32" y="338">average() : "4.67"</text>
      <text class="label small" x="140" y="366">a row of a ranking</text>
      <path class="arrow dashed" d="M320 210 L230 256"/>
      <text class="label small" x="300" y="246">creates</text>

      <rect class="box cache" x="320" y="290" width="260" height="120"/>
      <text class="label big" x="450" y="314">Rankings</text>
      <path class="arrow none" d="M320 328 L580 328"/>
      <text class="label mono left" x="332" y="348">BY_AVERAGE (cross-multiply)</text>
      <text class="label mono left" x="332" y="368">DEFAULT = avg, count, id</text>
      <text class="label mono left" x="332" y="388">ALPHABETICAL_TIES</text>
      <path class="arrow dashed" d="M450 210 L450 286"/>
      <text class="label small" x="485" y="252">uses</text>

      <rect class="box cache" x="660" y="40" width="220" height="80"/>
      <text class="label small" x="770" y="56">&#171;interface&#187;</text>
      <text class="label big" x="770" y="76">Exporter</text>
      <path class="arrow none" d="M660 86 L880 86"/>
      <text class="label mono left" x="672" y="108">export(rows) : String</text>
      <path class="arrow dashed" d="M620 80 L656 80"/>

      <rect class="box plain" x="650" y="190" width="110" height="50"/>
      <text class="label small" x="705" y="220">CsvExporter</text>
      <rect class="box plain" x="775" y="190" width="115" height="50"/>
      <text class="label small" x="832" y="220">JsonExporter</text>
      <path class="arrow dashed none" d="M705 190 L745 122" style="marker-end:url(#rs-cd-tri)"/>
      <path class="arrow dashed none" d="M832 190 L800 122" style="marker-end:url(#rs-cd-tri)"/>

      <rect class="zone" x="620" y="300" width="270" height="200"/>
      <text class="label small left" x="634" y="324">Stage map</text>
      <text class="label small left" x="634" y="348">1: Stats, AgentScore, rate, averages</text>
      <text class="label small left" x="634" y="372">2: Rankings comparator</text>
      <text class="label small left" x="634" y="396">3: byMonth buckets, bestOfMonth</text>
      <text class="label small left" x="634" y="420">4: Exporter + 2 formats</text>
      <text class="label small left" x="634" y="444">5: ConcurrentHashMap.compute</text>
      <text class="label small left" x="634" y="476">each stage adds, none rewrites</text>
    </svg>
    <figcaption>Filled diamond: the service owns its Stats buckets. Dashed arrows: "creates / uses". Dashed lines with hollow triangles: "implements". The two Strategy seams are the ranking comparator and the Exporter interface.</figcaption>
  </figure>
