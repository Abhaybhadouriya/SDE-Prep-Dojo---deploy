
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 900 560" role="img" aria-label="UML class diagram for the chat application: ChatServer owns users, chats and the map of online ChatClients; Chat is abstract with DirectChat and GroupChat; Chat owns Messages; Message holds a Receipt per recipient; Receipt is an enum SENT, DELIVERED, READ; ChatClient is the observer interface">
      <defs>
        <marker id="ca-cd-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="ca-cd-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <rect class="box svc" x="290" y="20" width="330" height="200"/>
      <text class="label big" x="455" y="44">ChatServer</text>
      <path class="arrow none" d="M290 58 L620 58"/>
      <text class="label mono left" x="302" y="78">- chats : Map&lt;id, Chat&gt;</text>
      <text class="label mono left" x="302" y="98">- online : Map&lt;user, Connection&gt;</text>
      <text class="label mono left" x="302" y="118">+ direct(a, b) / group(...)</text>
      <text class="label mono left" x="302" y="138">+ send(user, chat, text) : Message</text>
      <text class="label mono left" x="302" y="158">+ connect / disconnect / ack(user, chat, seq)</text>
      <text class="label mono left" x="302" y="178">+ markRead / unread / history</text>
      <text class="label small" x="455" y="208">Mediator + facade; lock per chat</text>

      <rect class="box client" x="20" y="20" width="190" height="80"/>
      <text class="label big" x="115" y="44">User</text>
      <path class="arrow none" d="M20 58 L210 58"/>
      <text class="label mono left" x="32" y="82">id, name</text>
      <path class="arrow none" d="M290 60 L212 60" style="marker-start:url(#ca-cd-dia)"/>

      <rect class="box cache" x="690" y="20" width="200" height="90"/>
      <text class="label small" x="790" y="40">&#171;interface&#187; Observer</text>
      <text class="label big" x="790" y="62">ChatClient</text>
      <text class="label mono" x="790" y="84">onMessage(m)</text>
      <text class="label mono" x="790" y="102">onReceipt(m, by, now)</text>
      <path class="arrow dashed" d="M620 80 L686 70"/>
      <text class="label small" x="655" y="100">0..*</text>
      <rect class="box client" x="700" y="140" width="190" height="40"/><text class="label small" x="795" y="164">ConsoleClient / WebSocket</text>
      <path class="arrow dashed" d="M795 140 L790 114" style="marker-end:url(#ca-cd-tri)"/>

      <rect class="box svc" x="300" y="270" width="310" height="140"/>
      <text class="label small" x="455" y="288">&#171;abstract&#187;</text>
      <text class="label big" x="455" y="308">Chat</text>
      <path class="arrow none" d="M300 318 L610 318"/>
      <text class="label mono left" x="312" y="338">members : Map&lt;user, joinSeq&gt;</text>
      <text class="label mono left" x="312" y="358">messages : List, nextSeq, lock</text>
      <text class="label mono left" x="312" y="378">+ append(...) / visibleTo(user)</text>
      <text class="label mono left" x="312" y="398">+ checkCanChangeMembers() abstract</text>
      <path class="arrow none" d="M455 220 L455 268" style="marker-start:url(#ca-cd-dia)"/>

      <rect class="box svc" x="200" y="460" width="190" height="60"/>
      <text class="label big" x="295" y="484">DirectChat</text>
      <text class="label small" x="295" y="506">exactly 2 members</text>
      <rect class="box svc" x="420" y="460" width="210" height="80"/>
      <text class="label big" x="525" y="484">GroupChat</text>
      <text class="label mono" x="525" y="506">name, admins : Set</text>
      <text class="label small" x="525" y="526">admins add / remove</text>
      <path class="arrow" d="M295 460 L410 414" style="marker-end:url(#ca-cd-tri)"/>
      <path class="arrow" d="M525 460 L490 414" style="marker-end:url(#ca-cd-tri)"/>

      <rect class="box db" x="20" y="260" width="230" height="150"/>
      <text class="label big" x="135" y="284">Message</text>
      <path class="arrow none" d="M20 298 L250 298"/>
      <text class="label mono left" x="32" y="318">id, chatId, senderId</text>
      <text class="label mono left" x="32" y="338">seq, text</text>
      <text class="label mono left" x="32" y="358">receipts : Map&lt;user, Receipt&gt;</text>
      <text class="label mono left" x="32" y="378">+ apply / claimPush : bool</text>
      <text class="label mono left" x="32" y="398">+ status() : lowest receipt</text>
      <path class="arrow none" d="M300 340 L252 340" style="marker-start:url(#ca-cd-dia)"/>
      <text class="label small" x="276" y="330">0..*</text>

      <rect class="box plain" x="20" y="460" width="160" height="80"/>
      <text class="label small" x="100" y="480">&#171;enum&#187; State</text>
      <text class="label big" x="100" y="502">Receipt</text>
      <text class="label mono" x="100" y="526">SENT DELIVERED READ</text>
      <path class="arrow dashed" d="M100 410 L100 456"/>

      <rect class="box plain" x="680" y="270" width="210" height="100"/>
      <text class="label small left" x="692" y="292">ChatException</text>
      <text class="label small left" x="692" y="314">"not an admin", "not in chat",</text>
      <text class="label small left" x="692" y="334">"empty message", "exactly two"</text>
      <path class="arrow dashed" d="M620 200 L700 268"/>
      <text class="label small" x="700" y="230">throws</text>
    </svg>
    <figcaption>Filled diamonds are composition: the server owns users and chats, a chat owns its messages. Hollow triangles are "extends" or "implements". The server depends only on the <code>ChatClient</code> interface, so a console, a WebSocket session or a test sink can be plugged in. <code>Message.receipts</code> holds one <code>Receipt</code> per recipient; the sender is not in it.</figcaption>
  </figure>
  <h3>The receipt state machine (per recipient)</h3>
  <figure class="diagram">
    <svg viewBox="0 0 860 300" role="img" aria-label="State diagram for one recipient's receipt: SENT to DELIVERED on delivery; SENT to READ on read; DELIVERED to READ on read; DELIVERED stays on a repeated delivery; READ ignores every event">
      <rect class="box client" x="60" y="110" width="170" height="60"/><text class="label big" x="145" y="145">SENT</text>
      <rect class="box cache" x="345" y="110" width="170" height="60"/><text class="label big" x="430" y="145">DELIVERED</text>
      <rect class="box svc" x="630" y="110" width="170" height="60"/><text class="label big" x="715" y="145">READ</text>
      <path class="arrow" d="M230 140 L343 140"/><text class="label small" x="287" y="130">delivered</text>
      <path class="arrow" d="M515 140 L628 140"/><text class="label small" x="572" y="130">read</text>
      <path class="arrow" d="M145 108 C 200 30, 660 30, 715 108"/><text class="label small" x="430" y="48">read (reading implies delivery)</text>
      <path class="arrow" d="M400 172 C 390 230, 470 230, 460 172"/><text class="label small" x="430" y="246">delivered again: no change</text>
      <path class="arrow" d="M690 172 C 680 230, 760 230, 750 172"/><text class="label small" x="720" y="262">any event: no change</text>
    </svg>
    <figcaption>Only forward moves exist. <code>apply</code> returns <code>true</code> only when the state really changes, and that boolean makes acks and read receipts idempotent. SENT to DELIVERED happens only when the device acknowledges the message. The ticks the sender sees are <code>min</code> over all recipients.</figcaption>
  </figure>
