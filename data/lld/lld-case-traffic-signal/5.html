
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 900 540" role="img" aria-label="UML class diagram: Controller holds the current ControllerState, a TimingStrategy, phases, four TrafficSignals, queues, an emergency queue and SignalListeners; five states implement ControllerState; FixedTiming and AdaptiveTiming implement TimingStrategy; ConflictMonitor implements SignalListener">
      <defs>
        <marker id="ts-cd-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="ts-cd-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <rect class="box svc" x="300" y="20" width="310" height="230"/>
      <text class="label big" x="455" y="44">Controller</text>
      <path class="arrow none" d="M300 58 L610 58"/>
      <text class="label mono left" x="312" y="78">- state : ControllerState</text>
      <text class="label mono left" x="312" y="98">- phaseIndex, timer, now</text>
      <text class="label mono left" x="312" y="118">- queues ; pendingEmergencies</text>
      <path class="arrow none" d="M300 128 L610 128"/>
      <text class="label mono left" x="312" y="148">+ start() ; tick(n)</text>
      <text class="label mono left" x="312" y="168">+ arrive(d, cars) ; requestWalk(p)</text>
      <text class="label mono left" x="312" y="188">+ emergency(d) ; emergencyCleared()</text>
      <text class="label mono left" x="312" y="208">+ fault() ; repair() ; setTiming(t)</text>
      <text class="label small" x="455" y="236">context; synchronized; delegates to state</text>

      <rect class="box db" x="20" y="20" width="200" height="90"/>
      <text class="label big" x="120" y="44">TrafficSignal</text>
      <path class="arrow none" d="M20 58 L220 58"/>
      <text class="label mono left" x="32" y="78">dir ; light</text>
      <text class="label mono left" x="32" y="98">+ set(l) : refuses unsafe</text>
      <path class="arrow none" d="M300 70 L222 70" style="marker-start:url(#ts-cd-dia)"/>
      <text class="label small" x="260" y="62">4</text>

      <rect class="box db" x="20" y="150" width="200" height="70"/>
      <text class="label big" x="120" y="174">Phase</text>
      <text class="label mono" x="120" y="200">name ; dirs : Set</text>
      <path class="arrow none" d="M300 180 L222 185" style="marker-start:url(#ts-cd-dia)"/>
      <text class="label small" x="260" y="174">1..*</text>

      <rect class="box plain" x="690" y="20" width="190" height="60"/>
      <text class="label small" x="785" y="40">«enum»</text>
      <text class="label mono" x="785" y="64">Direction ; Light</text>

      <rect class="box cache" x="660" y="110" width="220" height="70"/>
      <text class="label small" x="770" y="130">«interface»</text>
      <text class="label big" x="770" y="152">TimingStrategy</text>
      <text class="label mono" x="770" y="172">greenSeconds(phase, queues)</text>
      <path class="arrow none" d="M610 140 L658 140" style="marker-start:url(#ts-cd-dia)"/>
      <rect class="box cache" x="660" y="210" width="105" height="50"/><text class="label small" x="712" y="240">Fixed</text>
      <rect class="box cache" x="775" y="210" width="105" height="50"/><text class="label small" x="827" y="240">Adaptive</text>
      <path class="arrow dashed" d="M712 210 L750 184" style="marker-end:url(#ts-cd-tri)"/>
      <path class="arrow dashed" d="M827 210 L790 184" style="marker-end:url(#ts-cd-tri)"/>

      <rect class="box client" x="660" y="300" width="220" height="60"/>
      <text class="label small" x="770" y="320">«interface»</text>
      <text class="label" x="770" y="342">SignalListener</text>
      <path class="arrow none" d="M600 250 L700 298" style="marker-start:url(#ts-cd-dia)"/>
      <text class="label small" x="640" y="290">0..*</text>
      <rect class="box client" x="660" y="400" width="220" height="50"/><text class="label small" x="770" y="430">ConflictMonitor</text>
      <path class="arrow dashed" d="M770 400 L770 364" style="marker-end:url(#ts-cd-tri)"/>

      <rect class="box cache" x="200" y="300" width="380" height="80"/>
      <text class="label small" x="390" y="320">«interface»</text>
      <text class="label big" x="390" y="342">ControllerState</text>
      <text class="label mono" x="390" y="366">enter, tick, emergency, emergencyCleared, fault, repair</text>
      <path class="arrow none" d="M390 250 L390 298" style="marker-start:url(#ts-cd-dia)"/>
      <text class="label small left" x="400" y="280">current</text>

      <rect class="box svc" x="20" y="460" width="105" height="50"/><text class="label small" x="72" y="490">Green</text>
      <rect class="box warn" x="135" y="460" width="105" height="50"/><text class="label small" x="187" y="490">Yellow</text>
      <rect class="box plain" x="250" y="460" width="105" height="50"/><text class="label small" x="302" y="490">AllRed</text>
      <rect class="box fail" x="365" y="460" width="120" height="50"/><text class="label small" x="425" y="490">Emergency(d)</text>
      <rect class="box db" x="495" y="460" width="110" height="50"/><text class="label small" x="550" y="490">Flashing</text>
      <path class="arrow dashed" d="M72 460 L290 384" style="marker-end:url(#ts-cd-tri)"/>
      <path class="arrow dashed" d="M187 460 L330 384" style="marker-end:url(#ts-cd-tri)"/>
      <path class="arrow dashed" d="M302 460 L370 384" style="marker-end:url(#ts-cd-tri)"/>
      <path class="arrow dashed" d="M425 460 L410 384" style="marker-end:url(#ts-cd-tri)"/>
      <path class="arrow dashed" d="M550 460 L460 384" style="marker-end:url(#ts-cd-tri)"/>
    </svg>
    <figcaption>The Controller (context) owns all data: signals, phases, queues, the emergency queue, the timer. States are tiny; only Emergency carries a field (where the vehicle came from, for the log). Timing and listeners are injected, so tests can plug in a fixed timer and a conflict monitor.</figcaption>
  </figure>
