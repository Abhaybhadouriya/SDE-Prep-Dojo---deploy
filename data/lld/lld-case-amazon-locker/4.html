
  <h2>Class diagram</h2>
  <p>Filled diamond: composition (the station owns its slots and deliveries). Dashed line with hollow triangle: implements. Plain arrow: association. The facade holds the swappable policies; the station holds all mutable state.</p>
  <figure class="diagram">
    <svg viewBox="0 0 980 640" role="img" aria-label="UML class diagram of the Amazon Locker design">
      <defs>
        <marker id="al-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="al-fdia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <!-- LockerService -->
      <rect class="box svc" x="20" y="20" width="330" height="250"/>
      <text class="label" x="185" y="42">LockerService</text>
      <path class="line" d="M20 58 H350"/>
      <text class="label mono left" x="30" y="78">- stations : Map&lt;String, LockerStation&gt;</text>
      <text class="label mono left" x="30" y="98">- strategy : SlotAllocationStrategy</text>
      <text class="label mono left" x="30" y="118">- codes : CodeGenerator</text>
      <text class="label mono left" x="30" y="138">- listeners, clock, holdMs</text>
      <path class="line" d="M20 150 H350"/>
      <text class="label mono left" x="30" y="170">+ deposit(stationId, Parcel) : Receipt</text>
      <text class="label mono left" x="30" y="190">+ pickup(stationId, code) : Result</text>
      <text class="label mono left" x="30" y="210">+ expireOverdue() : int</text>
      <text class="label mono left" x="30" y="230">+ collectExpired(stationId)</text>
      <text class="label mono left" x="30" y="250">+ setOutOfService / availability</text>
      <!-- LockerStation -->
      <rect class="box db" x="420" y="20" width="300" height="250"/>
      <text class="label" x="570" y="42">LockerStation</text>
      <path class="line" d="M420 58 H720"/>
      <text class="label mono left" x="430" y="78">- slots : Map&lt;String, Slot&gt;</text>
      <text class="label mono left" x="430" y="98">- free : EnumMap&lt;Size, Deque&lt;Slot&gt;&gt;</text>
      <text class="label mono left" x="430" y="118">- byCode : Map&lt;String, Delivery&gt;</text>
      <text class="label mono left" x="430" y="138">- byParcel : Map&lt;String, Delivery&gt;</text>
      <text class="label mono left" x="430" y="158">- badAttempts, keypadLockedUntil</text>
      <path class="line" d="M420 170 H720"/>
      <text class="label mono left" x="430" y="190">synchronized deposit / pickup</text>
      <text class="label mono left" x="430" y="210">synchronized expireDue / collect</text>
      <text class="label mono left" x="430" y="230">+ count(Size) : int  «FreeSlots»</text>
      <text class="label small" x="570" y="256">one lock per station</text>
      <path class="arrow none" d="M352 80 L420 80" style="marker-start:url(#al-fdia)"/>
      <text class="label small" x="386" y="96">1..*</text>
      <!-- Slot -->
      <rect class="box cache" x="770" y="20" width="190" height="120"/>
      <text class="label" x="865" y="42">Slot</text>
      <path class="line" d="M770 58 H960"/>
      <text class="label mono left" x="780" y="78">- id : String</text>
      <text class="label mono left" x="780" y="98">- size : Size</text>
      <text class="label mono left" x="780" y="118">- state : SlotState</text>
      <path class="arrow none" d="M722 60 L770 60" style="marker-start:url(#al-fdia)"/>
      <text class="label small" x="746" y="54">*</text>
      <!-- Delivery -->
      <rect class="box cache" x="770" y="180" width="190" height="170"/>
      <text class="label" x="865" y="202">Delivery</text>
      <path class="line" d="M770 218 H960"/>
      <text class="label mono left" x="780" y="238">- parcel : Parcel</text>
      <text class="label mono left" x="780" y="258">- slot : Slot</text>
      <text class="label mono left" x="780" y="278">- code : String</text>
      <text class="label mono left" x="780" y="298">- expiresAt : long</text>
      <text class="label mono left" x="780" y="318">- state : DeliveryState</text>
      <path class="arrow none" d="M722 200 L770 200" style="marker-start:url(#al-fdia)"/>
      <path class="arrow" d="M865 180 L865 146"/>
      <!-- Parcel -->
      <rect class="box plain" x="770" y="400" width="190" height="110"/>
      <text class="label small" x="865" y="416">«immutable»</text>
      <text class="label" x="865" y="434">Parcel</text>
      <path class="line" d="M770 446 H960"/>
      <text class="label mono left" x="780" y="466">- id, customerId</text>
      <text class="label mono left" x="780" y="486">- size : Size</text>
      <path class="arrow" d="M865 350 L865 394"/>
      <!-- Strategy -->
      <rect class="box kafka" x="20" y="330" width="330" height="80"/>
      <text class="label small" x="185" y="348">«interface» Strategy</text>
      <text class="label" x="185" y="366">SlotAllocationStrategy</text>
      <path class="line" d="M20 378 H350"/>
      <text class="label mono left" x="30" y="398">+ choose(Size, FreeSlots) : Size</text>
      <path class="arrow" d="M120 270 L120 324"/>
      <rect class="box kafka" x="20" y="470" width="100" height="40"/><text class="label small" x="70" y="494">BestFit</text>
      <rect class="box kafka" x="130" y="470" width="100" height="40"/><text class="label small" x="180" y="494">ExactFit</text>
      <rect class="box kafka" x="240" y="470" width="130" height="40"/><text class="label small" x="305" y="494">ReservingBestFit</text>
      <path class="arrow dashed" d="M70 470 L120 412" style="marker-end:url(#al-tri)"/>
      <path class="arrow dashed" d="M180 470 L185 412" style="marker-end:url(#al-tri)"/>
      <path class="arrow dashed" d="M305 470 L260 412" style="marker-end:url(#al-tri)"/>
      <!-- CodeGenerator, Listener, Clock -->
      <rect class="box queue" x="420" y="330" width="300" height="60"/>
      <text class="label small" x="570" y="348">«interface» Strategy</text>
      <text class="label mono" x="570" y="372">CodeGenerator.next() : String</text>
      <rect class="box queue" x="420" y="410" width="300" height="60"/>
      <text class="label small" x="570" y="428">«interface» Observer</text>
      <text class="label mono" x="570" y="452">LockerListener.onDeposited/...</text>
      <rect class="box queue" x="420" y="490" width="300" height="40"/>
      <text class="label mono" x="570" y="515">Clock.now() : long</text>
      <path class="arrow" d="M300 270 L300 300 L560 300 L560 324"/>
      <path class="arrow" d="M340 270 L340 290 L740 290 L740 440 L726 440"/>
      <path class="arrow" d="M350 260 L390 260 L390 510 L414 510"/>
      <!-- enums -->
      <rect class="box plain" x="20" y="560" width="940" height="60"/>
      <text class="label mono" x="490" y="584">enum Size { SMALL, MEDIUM, LARGE; fitsIn(Size); forBox(l,w,h) }   enum SlotState { FREE, OCCUPIED, OUT_OF_SERVICE }</text>
      <text class="label mono" x="490" y="606">enum DeliveryState { DEPOSITED, PICKED_UP, EXPIRED, RETURNED }   LockerException(Reason)</text>
    </svg>
    <figcaption>Amazon Locker class diagram. Policies (strategy, code generator, clock, listeners) live on the facade and are shared; all mutable state lives inside a station behind that station's lock.</figcaption>
  </figure>
  <h3>Two state machines</h3>
  <figure class="diagram">
    <svg viewBox="0 0 800 240" role="img" aria-label="State machines for Slot and Delivery">
      <text class="label left" x="20" y="24">Slot</text>
      <rect class="box ok" x="40" y="40" width="120" height="40"/><text class="label small" x="100" y="65">FREE</text>
      <rect class="box cache" x="260" y="40" width="120" height="40"/><text class="label small" x="320" y="65">OCCUPIED</text>
      <rect class="box ghost" x="40" y="130" width="160" height="40"/><text class="label small" x="120" y="155">OUT_OF_SERVICE</text>
      <path class="arrow" d="M160 52 L254 52"/><text class="label small" x="207" y="46">deposit</text>
      <path class="arrow" d="M260 72 L166 72"/><text class="label small" x="212" y="90">pickup / collect</text>
      <path class="arrow" d="M80 80 L80 124"/><text class="label small" x="40" y="106">break</text>
      <path class="arrow" d="M140 130 L140 86"/><text class="label small" x="174" y="112">repair</text>
      <text class="label small bad" x="200" y="200">OCCUPIED cannot go straight to OUT_OF_SERVICE (SLOT_BUSY)</text>
      <text class="label left" x="440" y="24">Delivery</text>
      <rect class="box svc" x="460" y="40" width="130" height="40"/><text class="label small" x="525" y="65">DEPOSITED</text>
      <rect class="box ok" x="650" y="40" width="130" height="40"/><text class="label small" x="715" y="65">PICKED_UP</text>
      <rect class="box warn" x="460" y="130" width="130" height="40"/><text class="label small" x="525" y="155">EXPIRED</text>
      <rect class="box plain" x="650" y="130" width="130" height="40"/><text class="label small" x="715" y="155">RETURNED</text>
      <path class="arrow" d="M590 60 L644 60"/><text class="label small" x="617" y="52">code ok</text>
      <path class="arrow" d="M525 80 L525 124"/><text class="label small" x="580" y="108">now &gt;= expiresAt</text>
      <path class="arrow" d="M590 150 L644 150"/><text class="label small" x="617" y="186">courier collects</text>
    </svg>
    <figcaption>PICKED_UP and RETURNED are terminal and free the slot. EXPIRED keeps the slot occupied: the parcel is still physically inside.</figcaption>
  </figure>
