
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 900 560" role="img" aria-label="UML class diagram: VendingMachine holds a current State, an Inventory, a CashBox, escrow coins and a ChangeMaker; five state classes implement State; two change makers implement ChangeMaker">
      <defs>
        <marker id="vm-cd-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="vm-cd-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <rect class="box svc" x="300" y="20" width="300" height="200"/>
      <text class="label big" x="450" y="44">VendingMachine</text>
      <path class="arrow none" d="M300 58 L600 58"/>
      <text class="label mono left" x="312" y="78">- state : State</text>
      <text class="label mono left" x="312" y="98">- escrow : List&lt;Denomination&gt;</text>
      <text class="label mono left" x="312" y="118">- sales : int</text>
      <path class="arrow none" d="M300 128 L600 128"/>
      <text class="label mono left" x="312" y="148">+ insert(d) ; select(code)</text>
      <text class="label mono left" x="312" y="168">+ cancel() ; enter/exitMaintenance()</text>
      <text class="label mono left" x="312" y="188">+ restock(..) ; loadChange(..)</text>
      <text class="label small" x="450" y="210">context; synchronized; delegates to state</text>

      <rect class="box db" x="20" y="20" width="200" height="110"/>
      <text class="label big" x="120" y="44">Inventory</text>
      <path class="arrow none" d="M20 58 L220 58"/>
      <text class="label mono left" x="32" y="78">slots : code -&gt; Slot</text>
      <text class="label mono left" x="32" y="98">+ productAt(code)</text>
      <text class="label mono left" x="32" y="118">+ takeOne, restock</text>
      <path class="arrow none" d="M300 70 L222 70" style="marker-start:url(#vm-cd-dia)"/>

      <rect class="box db" x="20" y="170" width="200" height="100"/>
      <text class="label big" x="120" y="194">CashBox</text>
      <path class="arrow none" d="M20 208 L220 208"/>
      <text class="label mono left" x="32" y="228">counts : EnumMap</text>
      <text class="label mono left" x="32" y="248">+ addAll, removeAll, total</text>
      <path class="arrow none" d="M300 180 L222 210" style="marker-start:url(#vm-cd-dia)"/>

      <rect class="box plain" x="690" y="20" width="190" height="80"/>
      <text class="label small" x="785" y="40">«enum»</text>
      <text class="label big" x="785" y="62">Denomination</text>
      <text class="label mono" x="785" y="86">100 50 20 10 5 2 1</text>
      <rect class="box plain" x="690" y="120" width="190" height="60"/>
      <text class="label" x="785" y="144">Product</text>
      <text class="label mono" x="785" y="166">name, price</text>
      <rect class="box plain" x="690" y="200" width="190" height="60"/>
      <text class="label" x="785" y="224">Purchase</text>
      <text class="label mono" x="785" y="246">product, change</text>
      <path class="arrow dashed" d="M600 150 L688 150"/>
      <path class="arrow dashed" d="M600 200 L688 225"/>

      <rect class="box cache" x="640" y="320" width="240" height="70"/>
      <text class="label small" x="760" y="340">«interface»</text>
      <text class="label big" x="760" y="362">ChangeMaker</text>
      <text class="label mono" x="760" y="382">make(amount, available)</text>
      <path class="arrow none" d="M560 220 L700 318" style="marker-start:url(#vm-cd-dia)"/>
      <rect class="box cache" x="640" y="440" width="115" height="50"/><text class="label small" x="697" y="470">Greedy</text>
      <rect class="box cache" x="765" y="440" width="115" height="50"/><text class="label small" x="822" y="470">Dp (bounded)</text>
      <path class="arrow dashed" d="M697 440 L740 394" style="marker-end:url(#vm-cd-tri)"/>
      <path class="arrow dashed" d="M822 440 L780 394" style="marker-end:url(#vm-cd-tri)"/>

      <rect class="box cache" x="200" y="300" width="380" height="90"/>
      <text class="label small" x="390" y="320">«interface»</text>
      <text class="label big" x="390" y="342">State</text>
      <text class="label mono" x="390" y="364">insert, select, cancel, enter/exit, restock</text>
      <text class="label small" x="390" y="382">default: refuse "cannot X while NAME"</text>
      <path class="arrow none" d="M390 220 L390 298" style="marker-start:url(#vm-cd-dia)"/>
      <text class="label small left" x="400" y="262">current</text>

      <rect class="box svc" x="20" y="470" width="110" height="50"/><text class="label small" x="75" y="500">Idle</text>
      <rect class="box svc" x="140" y="470" width="120" height="50"/><text class="label small" x="200" y="500">HasMoney</text>
      <rect class="box svc" x="270" y="470" width="120" height="50"/><text class="label small" x="330" y="500">Dispensing</text>
      <rect class="box svc" x="400" y="470" width="110" height="50"/><text class="label small" x="455" y="500">SoldOut</text>
      <rect class="box svc" x="520" y="470" width="110" height="50"/><text class="label small" x="575" y="500">Maintenance</text>
      <path class="arrow dashed" d="M75 470 L300 394" style="marker-end:url(#vm-cd-tri)"/>
      <path class="arrow dashed" d="M200 470 L340 394" style="marker-end:url(#vm-cd-tri)"/>
      <path class="arrow dashed" d="M330 470 L380 394" style="marker-end:url(#vm-cd-tri)"/>
      <path class="arrow dashed" d="M455 470 L420 394" style="marker-end:url(#vm-cd-tri)"/>
      <path class="arrow dashed" d="M575 470 L470 394" style="marker-end:url(#vm-cd-tri)"/>
    </svg>
    <figcaption>The machine (context) owns the data: inventory, cash box, escrow and the current state. Each state class holds no data of its own, so one instance per state is shared. ChangeMaker is a second, independent strategy (GreedyChangeMaker and DpChangeMaker in the code).</figcaption>
  </figure>
