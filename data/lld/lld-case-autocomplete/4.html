
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 900 560" role="img" aria-label="UML class diagram: AutocompleteEngine owns a root TrieNode and uses a RankingStrategy with ByFrequency and ByRecency; TrieNode has children, an Entry and a cached topK list; TypingSession uses the engine; PathTrie owns Nodes with literal, param, star and globstar children and returns RouteMatch">
      <defs>
        <marker id="ac-cd-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="ac-cd-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <rect class="box svc" x="20" y="20" width="300" height="180"/>
      <text class="label big" x="170" y="44">AutocompleteEngine</text>
      <path class="arrow none" d="M20 58 L320 58"/>
      <text class="label mono left" x="32" y="78">- root : TrieNode, k, cacheTopK</text>
      <text class="label mono left" x="32" y="98">- rank : RankingStrategy</text>
      <text class="label mono left" x="32" y="118">- rw : ReadWriteLock, clock</text>
      <text class="label mono left" x="32" y="138">+ record(phrase, times)</text>
      <text class="label mono left" x="32" y="158">+ suggest(prefix) : List&lt;Suggestion&gt;</text>
      <text class="label mono left" x="32" y="178">+ remove(phrase) / session()</text>

      <rect class="box cache" x="380" y="20" width="230" height="70"/>
      <text class="label small" x="495" y="40">&#171;interface&#187; Strategy</text>
      <text class="label big" x="495" y="62">RankingStrategy</text>
      <text class="label mono" x="495" y="82">compare(a, b), name()</text>
      <path class="arrow dashed" d="M320 60 L376 56"/>
      <rect class="box cache" x="380" y="120" width="110" height="40"/><text class="label small" x="435" y="144">ByFrequency</text>
      <rect class="box cache" x="500" y="120" width="110" height="40"/><text class="label small" x="555" y="144">ByRecency</text>
      <path class="arrow dashed" d="M435 120 L470 94" style="marker-end:url(#ac-cd-tri)"/>
      <path class="arrow dashed" d="M555 120 L520 94" style="marker-end:url(#ac-cd-tri)"/>

      <rect class="box client" x="660" y="20" width="220" height="70"/>
      <text class="label big" x="770" y="44">TypingSession</text>
      <text class="label mono" x="770" y="66">typed : StringBuilder</text>
      <text class="label mono" x="770" y="84">+ type(char)</text>
      <path class="arrow" d="M660 70 C 520 200, 360 190, 322 170"/>
      <text class="label small" x="560" y="200">uses</text>

      <rect class="box db" x="20" y="250" width="300" height="120"/>
      <text class="label big" x="170" y="274">TrieNode</text>
      <path class="arrow none" d="M20 288 L320 288"/>
      <text class="label mono left" x="32" y="308">children : TreeMap&lt;char, TrieNode&gt;</text>
      <text class="label mono left" x="32" y="328">entry : Entry (null if no phrase ends)</text>
      <text class="label mono left" x="32" y="348">topK : List&lt;Entry&gt; (cache)</text>
      <path class="arrow none" d="M170 200 L170 248" style="marker-start:url(#ac-cd-dia)"/>
      <text class="label small" x="200" y="228">root</text>
      <path class="arrow none" d="M320 300 C 370 300, 370 360, 322 360" style="marker-start:url(#ac-cd-dia)"/>
      <text class="label small" x="380" y="335">0..*</text>

      <rect class="box db" x="20" y="420" width="300" height="80"/>
      <text class="label big" x="170" y="444">Entry</text>
      <text class="label mono" x="170" y="468">text, count, lastUsed</text>
      <text class="label small" x="170" y="488">returned as an immutable Suggestion</text>
      <path class="arrow dashed" d="M170 370 L170 416"/>

      <rect class="box svc" x="460" y="250" width="420" height="120"/>
      <text class="label big" x="670" y="274">PathTrie&lt;V&gt;</text>
      <path class="arrow none" d="M460 288 L880 288"/>
      <text class="label mono left" x="472" y="308">- root : Node, rw : ReadWriteLock</text>
      <text class="label mono left" x="472" y="328">+ put(pattern, value)   throws on duplicate / conflict</text>
      <text class="label mono left" x="472" y="348">+ match(path) : Optional&lt;RouteMatch&gt;   + findAll(query)</text>

      <rect class="box svc" x="460" y="420" width="250" height="120"/>
      <text class="label big" x="585" y="444">Node&lt;V&gt;</text>
      <path class="arrow none" d="M460 458 L710 458"/>
      <text class="label mono left" x="472" y="478">literal : TreeMap&lt;seg, Node&gt;</text>
      <text class="label mono left" x="472" y="498">param (+ paramName), star</text>
      <text class="label mono left" x="472" y="518">globstar, value, pattern</text>
      <path class="arrow none" d="M585 370 L585 418" style="marker-start:url(#ac-cd-dia)"/>

      <rect class="box client" x="740" y="420" width="140" height="80"/>
      <text class="label big" x="810" y="444">RouteMatch</text>
      <text class="label mono" x="810" y="468">value, pattern</text>
      <text class="label mono" x="810" y="488">params</text>
      <path class="arrow dashed" d="M810 370 L810 416"/>
    </svg>
    <figcaption>Left: the autocomplete engine owns the trie and depends only on the <code>RankingStrategy</code> interface. Right: the router trie, whose node has a slot per kind of segment. Filled diamonds are composition; hollow triangles are "implements"; dashed arrows are "creates / returns".</figcaption>
  </figure>
  <h3>What the cached trie looks like</h3>
  <figure class="diagram">
    <svg viewBox="0 0 860 330" role="img" aria-label="A trie for l, li, lin, linu, lr with a cached top-3 note at the l and lin nodes">
      <circle class="box svc" cx="80" cy="160" r="22"/><text class="label" x="80" y="165">root</text>
      <circle class="box svc" cx="200" cy="160" r="22"/><text class="label" x="200" y="165">l</text>
      <circle class="box svc" cx="320" cy="100" r="22"/><text class="label" x="320" y="105">i</text>
      <circle class="box svc" cx="320" cy="230" r="22"/><text class="label" x="320" y="235">r</text>
      <circle class="box svc" cx="440" cy="100" r="22"/><text class="label" x="440" y="105">n</text>
      <circle class="box db" cx="440" cy="230" r="22"/><text class="label" x="440" y="235">u ...</text>
      <circle class="box db" cx="560" cy="50" r="22"/><text class="label" x="560" y="55">u ...</text>
      <circle class="box db" cx="560" cy="110" r="22"/><text class="label" x="560" y="115">k ...</text>
      <circle class="box db" cx="560" cy="170" r="22"/><text class="label" x="560" y="175">t ...</text>
      <path class="arrow" d="M102 160 L176 160"/>
      <path class="arrow" d="M220 150 L298 108"/>
      <path class="arrow" d="M220 170 L298 222"/>
      <path class="arrow" d="M342 100 L416 100"/>
      <path class="arrow" d="M342 230 L416 230"/>
      <path class="arrow" d="M460 90 L538 56"/>
      <path class="arrow" d="M462 102 L536 110"/>
      <path class="arrow" d="M460 112 L538 164"/>
      <rect class="box cache" x="120" y="250" width="200" height="66"/>
      <text class="label small left" x="130" y="270">topK at "l": linux kernel 5,</text>
      <text class="label small left" x="130" y="288">lru cache 4, linked list 3</text>
      <path class="arrow dashed" d="M200 184 L200 248"/>
      <rect class="box cache" x="620" y="210" width="230" height="66"/>
      <text class="label small left" x="630" y="230">topK at "lin": linux kernel 5,</text>
      <text class="label small left" x="630" y="248">linked list 3, lint rules 3</text>
      <path class="arrow dashed" d="M462 110 C 560 220, 600 230, 618 236"/>
      <text class="label small left" x="610" y="50">linux kernel (5), linus torvalds (2), linux kernel modules (1)</text>
      <text class="label small left" x="610" y="115">linked list (3)</text>
      <text class="label small left" x="610" y="175">lint rules (3)</text>
      <text class="label small left" x="470" y="300">a phrase ends at a node that holds an Entry (dark nodes)</text>
    </svg>
    <figcaption>Every node keeps the best k entries of its subtree. <code>suggest("lin")</code> is a walk of 3 characters and a copy of 3 entries, whatever the size of the subtree. The price is memory (k references per node) and work on every <code>record</code>: one update per character of the phrase.</figcaption>
  </figure>
