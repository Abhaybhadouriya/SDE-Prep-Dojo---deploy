
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 1000 600" role="img" aria-label="UML class diagram: UrlShortener uses CodeGenerator, UrlRepository, UrlValidator, Clock and ClickListeners and creates ShortUrl entities; three generators implement CodeGenerator; InMemoryUrlRepository implements UrlRepository">
      <defs>
        <marker id="url-cd-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="url-cd-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <rect class="box svc" x="300" y="20" width="400" height="210"/>
      <text class="label small" x="500" y="38">«facade»</text>
      <text class="label big" x="500" y="58">UrlShortener</text>
      <path class="arrow none" d="M300 68 L700 68"/>
      <text class="label mono left" x="312" y="88">- codeByUrl : Map&lt;(owner,url),code&gt;  (dedupe)</text>
      <text class="label mono left" x="312" y="108">- collisions : LongAdder</text>
      <path class="arrow none" d="M300 118 L700 118"/>
      <text class="label mono left" x="312" y="138">+ shorten(ShortenRequest) : ShortUrl</text>
      <text class="label mono left" x="312" y="158">+ resolve(code) : Resolution</text>
      <text class="label mono left" x="312" y="178">+ delete(code, owner)</text>
      <text class="label mono left" x="312" y="198">+ purgeExpired() : int</text>
      <text class="label mono left" x="312" y="218">+ clicks(code), topK(k)</text>

      <rect class="box db" x="740" y="20" width="240" height="190"/>
      <text class="label small" x="860" y="38">«entity»</text>
      <text class="label big" x="860" y="58">ShortUrl</text>
      <path class="arrow none" d="M740 68 L980 68"/>
      <text class="label mono left" x="752" y="88">code, longUrl, owner</text>
      <text class="label mono left" x="752" y="108">createdAt, expiresAt?</text>
      <text class="label mono left" x="752" y="128">custom : boolean</text>
      <text class="label mono left" x="752" y="148">clicks : LongAdder</text>
      <path class="arrow none" d="M740 158 L980 158"/>
      <text class="label mono left" x="752" y="178">+ expired(now)</text>
      <path class="arrow dashed" d="M700 100 L738 100"/>
      <text class="label small" x="719" y="92">creates</text>

      <rect class="box plain" x="20" y="20" width="240" height="90"/>
      <text class="label big" x="140" y="44">UrlValidator</text>
      <path class="arrow none" d="M20 56 L260 56"/>
      <text class="label mono left" x="32" y="78">+ normalize(url) : String</text>
      <text class="label mono left" x="32" y="98">+ checkAlias(alias)</text>
      <path class="arrow none" d="M300 60 L262 60" style="marker-start:url(#url-cd-dia)"/>

      <rect class="box plain" x="20" y="130" width="240" height="70"/>
      <text class="label small" x="140" y="150">«interface»</text>
      <text class="label" x="140" y="170">Clock</text>
      <text class="label mono" x="140" y="190">now() ; FakeClock in tests</text>
      <path class="arrow none" d="M300 165 L262 165" style="marker-start:url(#url-cd-dia)"/>

      <rect class="box cache" x="60" y="300" width="260" height="70"/>
      <text class="label small" x="190" y="320">«interface»</text>
      <text class="label" x="190" y="340">CodeGenerator</text>
      <text class="label mono" x="190" y="360">generate(url, attempt)</text>
      <path class="arrow none" d="M380 230 L250 298" style="marker-start:url(#url-cd-dia)"/>

      <rect class="box db" x="400" y="300" width="260" height="110"/>
      <text class="label small" x="530" y="320">«interface»</text>
      <text class="label" x="530" y="340">UrlRepository</text>
      <text class="label mono left" x="412" y="362">saveIfAbsent(u) : boolean</text>
      <text class="label mono left" x="412" y="382">find(code), delete(code)</text>
      <text class="label mono left" x="412" y="402">all()</text>
      <path class="arrow none" d="M530 230 L530 298" style="marker-start:url(#url-cd-dia)"/>

      <rect class="box warn" x="720" y="300" width="260" height="70"/>
      <text class="label small" x="850" y="320">«interface»</text>
      <text class="label" x="850" y="340">ClickListener</text>
      <text class="label mono" x="850" y="360">onClick(u, at)</text>
      <path class="arrow" d="M680 230 L800 298"/>
      <text class="label small" x="790" y="262">notifies 0..*</text>

      <rect class="box cache" x="20" y="470" width="150" height="56"/><text class="label" x="95" y="493">Counter</text><text class="label small" x="95" y="513">AtomicLong + base62</text>
      <rect class="box cache" x="180" y="470" width="150" height="56"/><text class="label" x="255" y="493">Hash</text><text class="label small" x="255" y="513">SHA-256(url#attempt)</text>
      <rect class="box cache" x="100" y="536" width="150" height="56"/><text class="label" x="175" y="559">Random</text><text class="label small" x="175" y="579">draw again on clash</text>
      <path class="arrow dashed" d="M95 470 L150 374" style="marker-end:url(#url-cd-tri)"/>
      <path class="arrow dashed" d="M255 470 L230 374" style="marker-end:url(#url-cd-tri)"/>
      <path class="arrow dashed" d="M250 560 C 350 540, 340 430, 290 374" style="marker-end:url(#url-cd-tri)"/>

      <rect class="box db" x="400" y="480" width="260" height="56"/><text class="label" x="530" y="503">InMemoryUrlRepository</text><text class="label small" x="530" y="523">ConcurrentHashMap.putIfAbsent</text>
      <path class="arrow dashed" d="M530 480 L530 414" style="marker-end:url(#url-cd-tri)"/>
      <rect class="box plain" x="720" y="480" width="260" height="56"/><text class="label" x="850" y="503">JdbcUrlRepository (later)</text><text class="label small" x="850" y="523">INSERT ... unique key</text>
      <path class="arrow dashed" d="M720 500 L664 410" style="marker-end:url(#url-cd-tri)"/>
    </svg>
    <figcaption>The facade owns its collaborators (filled diamonds) and creates ShortUrl entities. Dashed lines with hollow triangles: "implements". The JDBC repository is drawn to show where a database plugs in; it is not in the code.</figcaption>
  </figure>
