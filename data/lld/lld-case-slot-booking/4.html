
  <h2>Class diagram</h2>
  <p>Filled diamond = composition (the part lives and dies with the whole). Hollow diamond = a swappable "has a". Dashed line with a hollow triangle = implements. Plain arrow = association. See <a href="{{BASE}}lld/lld-uml-class">UML class diagrams</a> if any symbol is new.</p>
  <figure class="diagram">
    <svg viewBox="0 0 980 600" role="img" aria-label="UML class diagram of the slot booking system">
      <defs>
        <marker id="sb-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="sb-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="sb-fdia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <!-- BookingService -->
      <rect class="box svc" x="20" y="20" width="340" height="270"/>
      <text class="label" x="190" y="42">BookingService</text>
      <path class="line" d="M20 58 H360"/>
      <text class="label mono left" x="32" y="78">- slots : Map&lt;id, Slot&gt;</text>
      <text class="label mono left" x="32" y="98">- bookings : Map&lt;id, Booking&gt;</text>
      <text class="label mono left" x="32" y="118">- byUser : Map&lt;user, List&lt;Booking&gt;&gt;</text>
      <text class="label mono left" x="32" y="138">- rules : List&lt;BookingRule&gt;</text>
      <text class="label mono left" x="32" y="158">- clock : IntSupplier, lock</text>
      <path class="line" d="M20 168 H360"/>
      <text class="label mono left" x="32" y="188">+ addSlot(provider, from, to, cap, wl)</text>
      <text class="label mono left" x="32" y="208">+ available(category, ranking)</text>
      <text class="label mono left" x="32" y="228">+ book(user, slotId) : Booking</text>
      <text class="label mono left" x="32" y="248">+ cancel(bookingId) / cancelSlot(id)</text>
      <text class="label mono left" x="32" y="268">+ bookingsOf(user) / trending()</text>
      <!-- Slot -->
      <rect class="box db" x="430" y="20" width="290" height="190"/>
      <text class="label" x="575" y="42">Slot</text>
      <path class="line" d="M430 58 H720"/>
      <text class="label mono left" x="442" y="78">- provider : Provider</text>
      <text class="label mono left" x="442" y="98">- time : TimeRange</text>
      <text class="label mono left" x="442" y="118">- capacity, waitlistLimit : int</text>
      <text class="label mono left" x="442" y="138">- confirmed : Set&lt;bookingId&gt;</text>
      <text class="label mono left" x="442" y="158">- waitlist : Deque&lt;bookingId&gt;</text>
      <text class="label mono left" x="442" y="178">- status : OPEN | CANCELLED</text>
      <path class="line" d="M430 186 H720"/>
      <text class="label mono left" x="442" y="202">+ free() : int</text>
      <path class="arrow none" d="M362 80 L430 80" style="marker-start:url(#sb-fdia)"/><text class="label small" x="396" y="72">0..*</text>
      <!-- Provider and TimeRange -->
      <rect class="box client" x="770" y="20" width="190" height="90"/>
      <text class="label" x="865" y="42">Provider</text>
      <path class="line" d="M770 58 H960"/>
      <text class="label mono left" x="782" y="78">- name, category</text>
      <text class="label mono left" x="782" y="98">- rating : double</text>
      <path class="arrow" d="M720 70 L764 70"/>
      <rect class="box cache" x="770" y="130" width="190" height="80"/>
      <text class="label small" x="865" y="146">«value»</text>
      <text class="label" x="865" y="164">TimeRange</text>
      <path class="line" d="M770 176 H960"/>
      <text class="label mono left" x="782" y="196">+ overlaps(other)</text>
      <path class="arrow" d="M720 170 L764 170"/>
      <!-- Booking -->
      <rect class="box cache" x="430" y="250" width="290" height="120"/>
      <text class="label" x="575" y="272">Booking</text>
      <path class="line" d="M430 288 H720"/>
      <text class="label mono left" x="442" y="308">- id, user : String</text>
      <text class="label mono left" x="442" y="328">- slot : Slot</text>
      <text class="label mono left" x="442" y="348">- status : BookingStatus</text>
      <path class="arrow none" d="M362 260 L396 260 L396 310 L430 310" style="marker-start:url(#sb-fdia)"/><text class="label small" x="396" y="300">0..*</text>
      <path class="arrow" d="M575 250 L575 216"/>
      <!-- User and Tier -->
      <rect class="box client" x="770" y="250" width="190" height="80"/>
      <text class="label" x="865" y="272">User</text>
      <path class="line" d="M770 288 H960"/>
      <text class="label mono left" x="782" y="308">- name ; tier : Tier</text>
      <path class="arrow" d="M720 300 L764 300"/>
      <rect class="box plain" x="770" y="350" width="190" height="60"/>
      <text class="label small" x="865" y="368">«enum» Tier</text>
      <text class="label mono" x="865" y="392">PLATINUM 10 GOLD 5 SILVER 3</text>
      <path class="arrow" d="M865 330 L865 344"/>
      <!-- BookingRule -->
      <rect class="box kafka" x="20" y="330" width="340" height="70"/>
      <text class="label small" x="190" y="348">«interface»</text>
      <text class="label" x="190" y="366">BookingRule</text>
      <text class="label mono" x="190" y="388">+ check(user, slot, others)</text>
      <path class="arrow none" d="M100 292 L100 330" style="marker-start:url(#sb-dia)"/>
      <rect class="box plain" x="20" y="430" width="105" height="36"/><text class="label small" x="72" y="452">NoDuplicate</text>
      <rect class="box plain" x="137" y="430" width="105" height="36"/><text class="label small" x="189" y="452">NoOverlap</text>
      <rect class="box plain" x="254" y="430" width="106" height="36"/><text class="label small" x="307" y="452">TierQuota</text>
      <path class="arrow dashed" d="M72 430 L72 406" style="marker-end:url(#sb-tri)"/>
      <path class="arrow dashed" d="M189 430 L189 406" style="marker-end:url(#sb-tri)"/>
      <path class="arrow dashed" d="M307 430 L307 406" style="marker-end:url(#sb-tri)"/>
      <!-- RankingStrategy -->
      <rect class="box kafka" x="430" y="420" width="290" height="70"/>
      <text class="label small" x="575" y="438">«interface»</text>
      <text class="label" x="575" y="456">RankingStrategy</text>
      <text class="label mono" x="575" y="478">+ rank(slots) : List&lt;Slot&gt;</text>
      <path class="arrow dashed" d="M300 292 L300 310 L410 310 L410 455 L424 455"/>
      <text class="label small" x="370" y="410">uses</text>
      <rect class="box plain" x="430" y="520" width="135" height="36"/><text class="label small" x="497" y="542">ByStartTime</text>
      <rect class="box plain" x="585" y="520" width="135" height="36"/><text class="label small" x="652" y="542">ByRating</text>
      <path class="arrow dashed" d="M497 520 L497 496" style="marker-end:url(#sb-tri)"/>
      <path class="arrow dashed" d="M652 520 L652 496" style="marker-end:url(#sb-tri)"/>
      <!-- Listener -->
      <rect class="box queue" x="20" y="500" width="340" height="70"/>
      <text class="label small" x="190" y="518">«interface»</text>
      <text class="label" x="190" y="536">BookingListener</text>
      <text class="label mono" x="190" y="558">+ notify(user, message)</text>
      <path class="arrow none" d="M362 200 L380 200 L380 535 L362 535" style="marker-start:url(#sb-dia)"/>
    </svg>
    <figcaption>The service owns slots and bookings (composition). Rules and listeners are swappable lists (aggregation); a ranking strategy is passed per search call (dependency).</figcaption>
  </figure>
  <h3>The booking life cycle is a tiny state machine</h3>
  <figure class="diagram">
    <svg viewBox="0 0 800 200" role="img" aria-label="Booking states: waitlisted, confirmed, cancelled with transitions">
      <circle cx="40" cy="100" r="10" style="fill:var(--svg-arrow)"/>
      <rect class="box queue" x="120" y="30" width="170" height="44"/><text class="label" x="205" y="57">WAITLISTED</text>
      <rect class="box ok" x="120" y="126" width="170" height="44"/><text class="label" x="205" y="153">CONFIRMED</text>
      <rect class="box fail" x="560" y="78" width="170" height="44"/><text class="label" x="645" y="105">CANCELLED</text>
      <path class="arrow" d="M50 96 L114 56"/><text class="label small" x="60" y="62">book, full</text>
      <path class="arrow" d="M50 104 L114 146"/><text class="label small" x="60" y="146">book, free</text>
      <path class="arrow" d="M205 74 L205 120"/><text class="label small left" x="212" y="102">promote (rules re-checked)</text>
      <path class="arrow" d="M290 50 L554 92"/><text class="label small" x="430" y="56">leave waitlist / dropped / slot cancelled</text>
      <path class="arrow" d="M290 150 L554 110"/><text class="label small" x="430" y="156">cancel before cutoff / slot cancelled</text>
    </svg>
    <figcaption>CANCELLED is final. There is no path back from CONFIRMED to WAITLISTED. Every arrow is taken under the service lock.</figcaption>
  </figure>
