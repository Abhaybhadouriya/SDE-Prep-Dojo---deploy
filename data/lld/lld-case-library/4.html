
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 900 560" role="img" aria-label="UML class diagram for the library: LibraryService owns books, copies, members, loans and waitlists; BookCopy refers to Book; Loan links a BookCopy and a Member; FineStrategy has PerDayFine and GraceThenPerDayFine; AvailabilityListener is the observer">
      <defs>
        <marker id="lb-cd-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="lb-cd-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <rect class="box svc" x="290" y="20" width="320" height="190"/>
      <text class="label big" x="450" y="44">LibraryService</text>
      <path class="arrow none" d="M290 58 L610 58"/>
      <text class="label mono left" x="302" y="78">- waitlist : Map&lt;isbn, Deque&gt;</text>
      <text class="label mono left" x="302" y="98">- fines : EnumMap&lt;type, Fine&gt;</text>
      <text class="label mono left" x="302" y="118">+ search(q) / borrow(m, isbn)</text>
      <text class="label mono left" x="302" y="138">+ returnCopy(barcode) : fine</text>
      <text class="label mono left" x="302" y="158">+ reserve / renew / payDues</text>
      <text class="label mono left" x="302" y="178">+ expireHolds()</text>
      <text class="label small" x="450" y="200">facade; one lock; notifies after unlock</text>

      <rect class="box svc" x="20" y="20" width="200" height="100"/>
      <text class="label big" x="120" y="44">Book</text>
      <path class="arrow none" d="M20 58 L220 58"/>
      <text class="label mono left" x="32" y="80">isbn, title</text>
      <text class="label mono left" x="32" y="100">author, subject</text>
      <path class="arrow none" d="M290 60 L222 60" style="marker-start:url(#lb-cd-dia)"/>

      <text class="label big" x="120" y="214">BookCopy</text>

      <text class="label mono left" x="32" y="248">barcode, rack</text>
      <text class="label mono left" x="32" y="268">status : CopyStatus</text>

      <text class="label mono left" x="32" y="308">+ moveTo(next)</text>

      <text class="label small" x="120" y="400">&#171;enum&#187;</text>
      <text class="label big" x="120" y="420">CopyStatus</text>
      <text class="label mono" x="120" y="444">AVAILABLE BORROWED ON_HOLD LOST</text>
      <path class="arrow dashed" d="M120 320 L120 376"/>

      <text class="label big" x="780" y="44">Member</text>
      <path class="arrow none" d="M680 58 L880 58"/>

      <text class="label mono left" x="692" y="138">loans : Map</text>

      <rect class="box plain" x="680" y="190" width="200" height="70"/>

      <text class="label mono" x="780" y="254">FACULTY(5, 30)</text>

      <text class="label small" x="270" y="390">per type</text>
      <rect class="box cache" x="250" y="510" width="180" height="40"/><text class="label small" x="340" y="534">PerDayFine(rate, cap)</text>
      <rect class="box cache" x="450" y="510" width="200" height="40"/><text class="label small" x="550" y="534">GraceThenPerDayFine</text>
      <path class="arrow dashed" d="M340 510 L420 494" style="marker-end:url(#lb-cd-tri)"/>
      <path class="arrow dashed" d="M550 510 L480 494" style="marker-end:url(#lb-cd-tri)"/>

      <rect class="box cache" x="660" y="400" width="220" height="70"/>
      <text class="label small" x="770" y="420">&#171;interface&#187; Observer</text>
      <text class="label big" x="770" y="442">AvailabilityListener</text>

      <text class="label small" x="720" y="300">notifies 0..*</text>
      <rect class="box client" x="700" y="500" width="180" height="40"/><text class="label small" x="790" y="524">ConsoleNotifier / Email</text>
      <path class="arrow dashed" d="M790 500 L780 474" style="marker-end:url(#lb-cd-tri)"/>
    </svg>
    <figcaption>Filled diamonds are composition (the service owns the catalogue, members and active loans). A <code>BookCopy</code> points at its <code>Book</code> (many copies, one book). A <code>Loan</code> links one copy to one member. Hollow triangles are "implements". The service depends only on the <code>FineStrategy</code> and <code>AvailabilityListener</code> interfaces.</figcaption>
  </figure>
  <h3>The copy state machine</h3>
  <figure class="diagram">
    <svg viewBox="0 0 860 370" role="img" aria-label="State diagram for a book copy: AVAILABLE to BORROWED on borrow; BORROWED to AVAILABLE on return with nobody waiting; BORROWED to ON_HOLD on return with a queue; ON_HOLD to BORROWED when the holder borrows; ON_HOLD to AVAILABLE when the hold expires and the queue is empty; ON_HOLD to ON_HOLD when it expires and passes to the next member; BORROWED to LOST">
      <rect class="box svc" x="60" y="60" width="180" height="60"/><text class="label big" x="150" y="95">AVAILABLE</text>
      <rect class="box client" x="500" y="60" width="180" height="60"/><text class="label big" x="590" y="95">BORROWED</text>
      <rect class="box cache" x="280" y="250" width="180" height="60"/><text class="label big" x="370" y="285">ON_HOLD</text>
      <rect class="box fail" x="700" y="250" width="140" height="60"/><text class="label big" x="770" y="285">LOST</text>
      <path class="arrow" d="M240 78 L498 78"/><text class="label small" x="370" y="68">borrow</text>
      <path class="arrow" d="M498 104 L242 104"/><text class="label small" x="370" y="124">return, nobody waiting</text>
      <path class="arrow" d="M520 122 L400 248"/><text class="label small" x="330" y="185">return, queue waiting</text>
      <path class="arrow" d="M440 250 L560 122"/><text class="label small" x="640" y="185">holder borrows</text>
      <path class="arrow" d="M280 268 L170 124"/><text class="label small" x="110" y="200">hold expired,</text><text class="label small" x="110" y="216">queue empty</text>
      <path class="arrow" d="M340 312 C 330 355, 410 355, 400 314"/><text class="label small" x="520" y="348">hold expired, next in queue</text>
      <path class="arrow" d="M650 122 L750 248"/><text class="label small" x="760" y="185">reported lost</text>
    </svg>
    <figcaption>Every public operation is one legal move in this table. <code>BookCopy.moveTo</code> refuses anything else (returning an available copy, borrowing a lost one), so a logic bug fails loudly instead of corrupting state. LOST is terminal; it can also be entered from AVAILABLE during a stock audit.</figcaption>
  </figure>
