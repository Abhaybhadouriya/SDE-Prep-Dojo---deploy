
  <h2>Class diagram</h2>
  <p>Filled diamond = composition. Hollow diamond = swappable "has a". Dashed line with a hollow triangle = implements. Solid line with a hollow triangle = extends.</p>
  <figure class="diagram">
    <svg viewBox="0 0 980 620" role="img" aria-label="UML class diagram of the Q and A platform">
      <defs>
        <marker id="so-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="so-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="so-fdia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <!-- QaService -->
      <rect class="box svc" x="20" y="20" width="340" height="290"/>
      <text class="label" x="190" y="42">QaService</text>
      <path class="line" d="M20 58 H360"/>
      <text class="label mono left" x="32" y="78">- users : Map&lt;id, User&gt;</text>
      <text class="label mono left" x="32" y="98">- posts : Map&lt;id, Post&gt;</text>
      <text class="label mono left" x="32" y="118">- wordIndex : Map&lt;word, Set&lt;qid&gt;&gt;</text>
      <text class="label mono left" x="32" y="138">- rules : List&lt;PermissionRule&gt;</text>
      <text class="label mono left" x="32" y="158">- reputation : ReputationPolicy</text>
      <path class="line" d="M20 168 H360"/>
      <text class="label mono left" x="32" y="188">+ register / subscribe / unsubscribe</text>
      <text class="label mono left" x="32" y="208">+ ask(user, title, body, tags) : qid</text>
      <text class="label mono left" x="32" y="228">+ answer / comment</text>
      <text class="label mono left" x="32" y="248">+ vote(user, post, type) / retractVote</text>
      <text class="label mono left" x="32" y="268">+ accept(user, answerId)</text>
      <text class="label mono left" x="32" y="288">+ feed(user, filter) / search(text, filter)</text>
      <!-- Post -->
      <rect class="box db" x="430" y="20" width="300" height="170"/>
      <text class="label small" x="580" y="38">«abstract»</text>
      <text class="label" x="580" y="56">Post</text>
      <path class="line" d="M430 66 H730"/>
      <text class="label mono left" x="442" y="86">- id, body, createdAt</text>
      <text class="label mono left" x="442" y="106">- author : User</text>
      <text class="label mono left" x="442" y="126">- votes : Map&lt;voterId, VoteType&gt;</text>
      <text class="label mono left" x="442" y="146">- comments : List&lt;Comment&gt;; lock</text>
      <path class="line" d="M430 156 H730"/>
      <text class="label mono left" x="442" y="176">+ score() ; question()</text>
      <path class="arrow none" d="M362 100 L430 100" style="marker-start:url(#so-fdia)"/><text class="label small" x="396" y="92">0..*</text>
      <!-- User -->
      <rect class="box client" x="780" y="20" width="180" height="110"/>
      <text class="label" x="870" y="42">User</text>
      <path class="line" d="M780 58 H960"/>
      <text class="label mono left" x="792" y="78">- id, name</text>
      <text class="label mono left" x="792" y="98">- topics : Set</text>
      <text class="label mono left" x="792" y="118">- reputation (&gt;= 1)</text>
      <path class="arrow" d="M730 106 L774 106"/><text class="label small" x="752" y="98">author</text>
      <!-- Question / Answer -->
      <rect class="box cache" x="430" y="240" width="200" height="120"/>
      <text class="label" x="530" y="262">Question</text>
      <path class="line" d="M430 276 H630"/>
      <text class="label mono left" x="442" y="296">- title, tags</text>
      <text class="label mono left" x="442" y="316">- answers : List</text>
      <text class="label mono left" x="442" y="336">- accepted : Answer</text>
      <text class="label mono left" x="442" y="354">- followers : Set</text>
      <rect class="box cache" x="680" y="240" width="160" height="80"/>
      <text class="label" x="760" y="262">Answer</text>
      <path class="line" d="M680 276 H840"/>
      <text class="label mono left" x="692" y="300">- parent : Question</text>
      <path class="arrow none" d="M530 240 L530 196" style="marker-end:url(#so-tri)"/>
      <path class="arrow none" d="M760 240 L760 210 L620 210 L620 196" style="marker-end:url(#so-tri)"/>
      <path class="arrow none" d="M632 300 L680 300" style="marker-start:url(#so-fdia)"/><text class="label small" x="656" y="292">0..*</text>
      <rect class="box plain" x="870" y="240" width="90" height="80"/>
      <text class="label" x="915" y="262">Comment</text>
      <text class="label mono" x="915" y="292">author, text</text>
      <path class="arrow" d="M730 180 L915 180 L915 234"/>
      <!-- PermissionRule -->
      <rect class="box kafka" x="20" y="350" width="340" height="70"/>
      <text class="label small" x="190" y="368">«interface»</text>
      <text class="label" x="190" y="386">PermissionRule</text>
      <text class="label mono" x="190" y="408">+ check(user, action, tags)</text>
      <path class="arrow none" d="M100 312 L100 350" style="marker-start:url(#so-dia)"/>
      <rect class="box plain" x="20" y="450" width="160" height="36"/><text class="label small" x="100" y="472">ReputationPrivileges</text>
      <rect class="box plain" x="200" y="450" width="160" height="36"/><text class="label small" x="280" y="472">TopicSubscriptionRule</text>
      <path class="arrow dashed" d="M100 450 L100 426" style="marker-end:url(#so-tri)"/>
      <path class="arrow dashed" d="M280 450 L280 426" style="marker-end:url(#so-tri)"/>
      <!-- ReputationPolicy -->
      <rect class="box kafka" x="430" y="400" width="300" height="90"/>
      <text class="label small" x="580" y="418">«interface»</text>
      <text class="label" x="580" y="436">ReputationPolicy</text>
      <text class="label mono" x="580" y="458">+ forAuthor / forVoter(isQ, vote)</text>
      <text class="label mono" x="580" y="478">+ forAccepted / forAcceptor</text>
      <path class="arrow none" d="M362 160 L395 160 L395 445 L430 445" style="marker-start:url(#so-dia)"/>
      <rect class="box plain" x="480" y="520" width="200" height="36"/><text class="label small" x="580" y="542">StackOverflowReputation</text>
      <path class="arrow dashed" d="M580 520 L580 496" style="marker-end:url(#so-tri)"/>
      <!-- Listener, filters -->
      <rect class="box queue" x="20" y="520" width="340" height="70"/>
      <text class="label small" x="190" y="538">«interface»</text>
      <text class="label" x="190" y="556">QaListener</text>
      <text class="label mono" x="190" y="578">+ onEvent(userName, message)</text>
      <path class="arrow none" d="M362 290 L380 290 L380 555 L362 555" style="marker-start:url(#so-dia)"/>
      <rect class="box plain" x="770" y="400" width="190" height="100"/>
      <text class="label small" x="865" y="418">«specification»</text>
      <text class="label" x="865" y="436">Filters</text>
      <text class="label mono" x="865" y="458">anyTopic(..)</text>
      <text class="label mono" x="865" y="478">answered(bool)</text>
      <text class="label small" x="865" y="496">Predicate&lt;Question&gt;</text>
    </svg>
    <figcaption>Question and Answer extend Post, so voting, comments and scores are written once. The service owns all posts; rules, the reputation policy and listeners are injected.</figcaption>
  </figure>
