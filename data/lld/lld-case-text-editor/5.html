
  <h2>Class diagram</h2>
  <figure class="diagram">
    <svg viewBox="0 0 900 540" role="img" aria-label="UML class diagram: Editor owns a Document that owns a GapBuffer, holds undo and redo stacks of EditCommand, creates Snapshot mementos and uses a GlyphFactory; InsertCommand, DeleteCommand and MacroCommand implement EditCommand">
      <defs>
        <marker id="te-cd-tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1,1 L11,6 L1,11 z" style="fill:var(--surface);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
        <marker id="te-cd-dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="16" markerHeight="10" orient="auto"><path d="M1,5 L8,1 L15,5 L8,9 z" style="fill:var(--svg-arrow);stroke:var(--svg-arrow);stroke-width:1.4"/></marker>
      </defs>
      <rect class="box svc" x="300" y="20" width="310" height="230"/>
      <text class="label big" x="455" y="44">Editor</text>
      <path class="arrow none" d="M300 58 L610 58"/>
      <text class="label mono left" x="312" y="78">- cursor, goalCol : int</text>
      <text class="label mono left" x="312" y="98">- undo, redo : Deque&lt;Entry&gt;</text>
      <text class="label mono left" x="312" y="118">- historyLimit, canMerge</text>
      <path class="arrow none" d="M300 128 L610 128"/>
      <text class="label mono left" x="312" y="148">+ type(s) ; backspace() ; deleteForward()</text>
      <text class="label mono left" x="312" y="168">+ replaceAll(find, with) : int</text>
      <text class="label mono left" x="312" y="188">+ undo() ; redo() : boolean</text>
      <text class="label mono left" x="312" y="208">+ left/right/up/down/home/end/page*</text>
      <text class="label mono left" x="312" y="228">+ save() : Snapshot ; restore(s)</text>
      <text class="label small" x="455" y="244">facade; synchronized</text>

      <rect class="box db" x="20" y="20" width="210" height="110"/>
      <text class="label big" x="125" y="44">Document</text>
      <path class="arrow none" d="M20 58 L230 58"/>
      <text class="label mono left" x="32" y="78">+ insert(pos, s)</text>
      <text class="label mono left" x="32" y="98">+ delete(pos, n) : String</text>
      <text class="label mono left" x="32" y="118">+ lineStart / lineEnd</text>
      <path class="arrow none" d="M300 70 L232 70" style="marker-start:url(#te-cd-dia)"/>

      <rect class="box db" x="20" y="170" width="210" height="90"/>
      <text class="label big" x="125" y="194">GapBuffer</text>
      <path class="arrow none" d="M20 208 L230 208"/>
      <text class="label mono left" x="32" y="228">- buf : char[]</text>
      <text class="label mono left" x="32" y="248">- gapStart, gapEnd</text>
      <path class="arrow none" d="M125 132 L125 168" style="marker-start:url(#te-cd-dia)"/>

      <rect class="box plain" x="680" y="20" width="200" height="80"/>
      <text class="label small" x="780" y="40">«memento»</text>
      <text class="label big" x="780" y="62">Snapshot</text>
      <text class="label mono" x="780" y="86">private text, cursor</text>
      <path class="arrow dashed" d="M610 60 L678 60"/>
      <text class="label small" x="645" y="52">creates</text>

      <rect class="box cache" x="680" y="140" width="200" height="70"/>
      <text class="label small" x="780" y="160">«flyweight factory»</text>
      <text class="label big" x="780" y="182">GlyphFactory</text>
      <text class="label mono" x="780" y="200">get(ch, font)</text>
      <rect class="box cache" x="680" y="240" width="200" height="50"/>
      <text class="label" x="780" y="270">Glyph (ch, font)</text>
      <path class="arrow none" d="M780 212 L780 238" style="marker-start:url(#te-cd-dia)"/>
      <path class="arrow dashed" d="M610 180 L678 175"/>

      <rect class="box cache" x="300" y="320" width="310" height="80"/>
      <text class="label small" x="455" y="340">«interface»</text>
      <text class="label big" x="455" y="362">EditCommand</text>
      <text class="label mono" x="455" y="384">execute(doc) : int ; undo(doc)</text>
      <path class="arrow none" d="M455 252 L455 318" style="marker-start:url(#te-cd-dia)"/>
      <text class="label small left" x="465" y="290">0..limit, history</text>

      <rect class="box svc" x="120" y="450" width="200" height="60"/><text class="label" x="220" y="474">InsertCommand</text><text class="label mono" x="220" y="496">pos, text ; absorb()</text>
      <rect class="box svc" x="355" y="450" width="200" height="60"/><text class="label" x="455" y="474">DeleteCommand</text><text class="label mono" x="455" y="496">pos, len, removed</text>
      <rect class="box svc" x="590" y="450" width="200" height="60"/><text class="label" x="690" y="474">MacroCommand</text><text class="label mono" x="690" y="496">parts : List</text>
      <path class="arrow dashed" d="M220 450 L380 404" style="marker-end:url(#te-cd-tri)"/>
      <path class="arrow dashed" d="M455 450 L455 404" style="marker-end:url(#te-cd-tri)"/>
      <path class="arrow dashed" d="M690 450 L530 404" style="marker-end:url(#te-cd-tri)"/>
      <path class="arrow none" d="M790 470 C 860 430, 700 370, 612 370" style="marker-start:url(#te-cd-dia)"/>
      <text class="label small" x="826" y="420">children 0..*</text>
    </svg>
    <figcaption>The Editor is a facade over the document and the history. Commands get the Document as a parameter, so they are small value-like objects. MacroCommand holds other commands (Composite), which is how replace-all and revert become one undo step. Snapshot fields are private to the Editor (in Java it is a nested class).</figcaption>
  </figure>
