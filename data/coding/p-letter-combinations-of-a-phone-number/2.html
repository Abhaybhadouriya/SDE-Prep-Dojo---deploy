
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>digits</code></th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>"35"</code></td><td><code>["dj","dk","dl","ej","ek","el","fj","fk","fl"]</code></td><td>3 letters x 3 letters = 9 words.</td></tr>
      <tr><td><code>"9"</code></td><td><code>["w","x","y","z"]</code></td><td>One digit: each letter is a word. 9 has four letters.</td></tr>
      <tr><td><code>"72"</code></td><td>12 words: <code>"pa","pb","pc","qa",...,"sc"</code></td><td>7 has four letters (pqrs), 2 has three: 4 x 3 = 12.</td></tr>
    </tbody>
  </table></div>
  <figure class="diagram">
<svg viewBox="0 0 800 280" role="img" aria-label="A tree: the empty string branches to d, e, f for digit 3, and each of those branches to j, k, l for digit 5, giving 9 leaves"><text class="label small" x="400" y="28">digits = "35": pick a letter for 3, then a letter for 5</text><rect class="box plain" x="370" y="52" width="60" height="36"/><text class="label" x="400" y="76">""</text><line class="arrow" x1="400" y1="90" x2="150" y2="128"/><line class="arrow" x1="400" y1="90" x2="400" y2="128"/><line class="arrow" x1="400" y1="90" x2="650" y2="128"/><rect class="box cache" x="122" y="132" width="56" height="36"/><text class="label" x="150" y="156">d</text><rect class="box cache" x="372" y="132" width="56" height="36"/><text class="label" x="400" y="156">e</text><rect class="box cache" x="622" y="132" width="56" height="36"/><text class="label" x="650" y="156">f</text><line class="arrow" x1="150" y1="170" x2="75" y2="218"/><rect class="box ok" x="45" y="222" width="60" height="36"/><text class="label" x="75" y="246">dj</text><line class="arrow" x1="150" y1="170" x2="150" y2="218"/><rect class="box ok" x="120" y="222" width="60" height="36"/><text class="label" x="150" y="246">dk</text><line class="arrow" x1="150" y1="170" x2="225" y2="218"/><rect class="box ok" x="195" y="222" width="60" height="36"/><text class="label" x="225" y="246">dl</text><line class="arrow" x1="400" y1="170" x2="325" y2="218"/><rect class="box ok" x="295" y="222" width="60" height="36"/><text class="label" x="325" y="246">ej</text><line class="arrow" x1="400" y1="170" x2="400" y2="218"/><rect class="box ok" x="370" y="222" width="60" height="36"/><text class="label" x="400" y="246">ek</text><line class="arrow" x1="400" y1="170" x2="475" y2="218"/><rect class="box ok" x="445" y="222" width="60" height="36"/><text class="label" x="475" y="246">el</text><line class="arrow" x1="650" y1="170" x2="575" y2="218"/><rect class="box ok" x="545" y="222" width="60" height="36"/><text class="label" x="575" y="246">fj</text><line class="arrow" x1="650" y1="170" x2="650" y2="218"/><rect class="box ok" x="620" y="222" width="60" height="36"/><text class="label" x="650" y="246">fk</text><line class="arrow" x1="650" y1="170" x2="725" y2="218"/><rect class="box ok" x="695" y="222" width="60" height="36"/><text class="label" x="725" y="246">fl</text><text class="label small left" x="20" y="76">depth 0</text><text class="label small left" x="20" y="156">digit 3</text><text class="label small left" x="20" y="246">digit 5</text></svg>
<figcaption>Backtracking walks this tree depth-first: each level is one digit, each branch one of its letters, and every leaf at depth <code>len(digits)</code> is an answer. 3 &times; 3 = 9 leaves; with 4-letter keys (7, 9) a level has 4 branches.</figcaption>
