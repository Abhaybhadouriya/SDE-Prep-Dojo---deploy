
<h2>Examples</h2>

<thead><tr><th>Input</th><th>Output</th><th>Why</th></tr></thead>

<tr><td><code>l1 = [7,4,9], l2 = [5,6]</code></td><td><code>[2,1,0,1]</code></td><td>947 + 65 = 1012. Different lengths, and the last carry adds a new digit.</td></tr>
