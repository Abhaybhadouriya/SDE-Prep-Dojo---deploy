
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input</th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>nums = [2,-3,4,1,-1,3], k = 4</code></td><td><code>5</code></td><td><code>[-3,4,1,-1,3]</code> sums to 4. Shorter answers exist ([4], [2,-3,4,1]); we need the longest.</td></tr>
      <tr><td><code>nums = [-3,1,2,-2], k = 2</code></td><td><code>1</code></td><td>Only <code>[2]</code> sums to 2.</td></tr>
      <tr><td><code>nums = [3,3], k = 1</code></td><td><code>0</code></td><td>No subarray sums to 1.</td></tr>
    </tbody>
  </table></div>
  <figure class="diagram">
<svg viewBox="0 0 800 240" role="img" aria-label="Prefix sums 0,2,-1,3,4,3,6 of 2,-3,4,1,-1,3; pre[6] minus pre[1] equals 4 gives length 5; the value 3 appears twice and only the first copy is kept"><text class="label small left" x="10" y="84">prefix</text><rect class="box plain" x="90" y="60" width="64" height="40"/><text class="label" x="122" y="80">0</text><text class="label small" x="122" y="48">pre[0]</text><rect class="box ok" x="182" y="60" width="64" height="40"/><text class="label" x="214" y="80">2</text><text class="label small" x="214" y="48">pre[1]</text><rect class="box plain" x="274" y="60" width="64" height="40"/><text class="label" x="306" y="80">-1</text><text class="label small" x="306" y="48">pre[2]</text><rect class="box db" x="366" y="60" width="64" height="40"/><text class="label" x="398" y="80">3</text><text class="label small" x="398" y="48">pre[3]</text><rect class="box plain" x="458" y="60" width="64" height="40"/><text class="label" x="490" y="80">4</text><text class="label small" x="490" y="48">pre[4]</text><rect class="box fail" x="550" y="60" width="64" height="40"/><text class="label" x="582" y="80">3</text><text class="label small" x="582" y="48">pre[5]</text><rect class="box ok" x="642" y="60" width="64" height="40"/><text class="label" x="674" y="80">6</text><text class="label small" x="674" y="48">pre[6]</text><path class="arrow none ok" d="M 214 106 Q 444 196 674 106"/><text class="label ok" x="444" y="168">6 - 2 = 4: nums[1..5], length 5</text><path class="arrow none bad dashed" d="M 398 106 Q 490 136 582 106"/><text class="label bad small left" x="588" y="132">3 again: keep pre[3]</text><text class="label small" x="400" y="220">a later copy of the same prefix can only make the run shorter</text></svg>
<figcaption>For a fixed end, the farther left the matching prefix, the longer the subarray. So the map keeps the first index of every prefix value and never overwrites it (the repeated 3 at pre[5] is ignored).</figcaption>
</figure>
