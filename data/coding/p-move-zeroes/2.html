
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>nums</code></th><th>After the call</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[0,5,0,2,8]</code></td><td><code>[5,2,8,0,0]</code></td><td>The non-zeros 5, 2, 8 keep their order; both zeros go to the tail.</td></tr>
      <tr><td><code>[7]</code></td><td><code>[7]</code></td><td>One element, nothing to move.</td></tr>
      <tr><td><code>[3,0,0,-6]</code></td><td><code>[3,-6,0,0]</code></td><td>Negatives are non-zero and stay in order; "sort" would wrongly put -6 first.</td></tr>
    </tbody>
  </table></div>
