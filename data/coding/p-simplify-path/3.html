
  <h2>Recognise the pattern</h2>
  <div class="callout interview"><p><strong>Cue:</strong> tokens where one kind <b>cancels the most recent</b> surviving token -> stack. Here the tokens are path components and ".." cancels the latest directory.</p></div>
  <figure class="diagram">
<svg viewBox="0 0 800 240" role="img" aria-label="Four token rules: empty and dot skip, dot-dot pops, anything else pushes"><rect class="box plain" x="30" y="20" width="170" height="40"/><text class="label" x="115" y="40">"" (empty)</text><path class="arrow" d="M205 40 L255 40"/><rect class="box plain" x="260" y="20" width="170" height="40"/><text class="label" x="345" y="40">skip</text><text class="label small left" x="450" y="40">from //, a leading / or a trailing /</text><rect class="box plain" x="30" y="76" width="170" height="40"/><text class="label" x="115" y="96">"."</text><path class="arrow" d="M205 96 L255 96"/><rect class="box plain" x="260" y="76" width="170" height="40"/><text class="label" x="345" y="96">skip</text><text class="label small left" x="450" y="96">current directory</text><rect class="box plain" x="30" y="132" width="170" height="40"/><text class="label" x="115" y="152">".."</text><path class="arrow" d="M205 152 L255 152"/><rect class="box fail" x="260" y="132" width="170" height="40"/><text class="label" x="345" y="152">pop if not empty</text><text class="label small left" x="450" y="152">parent directory; at the root it stays at the root</text><rect class="box plain" x="30" y="188" width="170" height="40"/><text class="label" x="115" y="208">anything else</text><path class="arrow" d="M205 208 L255 208"/><rect class="box db" x="260" y="188" width="170" height="40"/><text class="label" x="345" y="208">push</text><text class="label small left" x="450" y="208">a real name, including "...", ".git", "..a"</text></svg>
<figcaption>After splitting on <code>/</code>, every part falls into exactly one of four cases. Only an exact <code>"."</code> or <code>".."</code> is special; compare whole tokens, never prefixes.</figcaption>
</figure>
