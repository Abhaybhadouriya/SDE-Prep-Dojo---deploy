
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>nums</code></th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[2,3,4,5]</code></td><td><b>[60,40,30,24]</b></td><td>60 = 3·4·5, 40 = 2·4·5, 30 = 2·3·5, 24 = 2·3·4.</td></tr>
      <tr><td><code>[-2,1,0,3,-1]</code></td><td><b>[0,0,6,0,0]</b></td><td>One zero: every product that includes it is 0; the zero's own slot is (-2)·1·3·(-1) = 6.</td></tr>
      <tr><td><code>[4,-1]</code></td><td><b>[-1,4]</b></td><td>n = 2: each answer is simply the other element.</td></tr>
    </tbody>
  </table></div>
  <figure class="diagram">
<svg viewBox="0 0 800 240" role="img" aria-label="Array 2,3,4,5,1 with index 2 skipped: the product of the left part (6) times the product of the right part (5) is 30"><rect class="box plain" x="140" y="70" width="80" height="48"/><text class="label" x="180" y="94">2</text><text class="label small" x="180" y="56">0</text><rect class="box plain" x="236" y="70" width="80" height="48"/><text class="label" x="276" y="94">3</text><text class="label small" x="276" y="56">1</text><rect class="box plain" x="332" y="70" width="80" height="48"/><text class="label" x="372" y="94">4</text><text class="label small" x="372" y="56">2</text><rect class="box plain" x="428" y="70" width="80" height="48"/><text class="label" x="468" y="94">5</text><text class="label small" x="468" y="56">3</text><rect class="box plain" x="524" y="70" width="80" height="48"/><text class="label" x="564" y="94">1</text><text class="label small" x="564" y="56">4</text><rect class="box ring k8s highlight" x="135" y="65" width="186" height="58"/><rect class="box ring k8s highlight" x="423" y="65" width="186" height="58"/><rect class="box fail" x="332" y="70" width="80" height="48" style="opacity:.35"/><text class="label" x="228" y="160">left = 2·3 = 6</text><text class="label" x="516" y="160">right = 5·1 = 5</text><text class="label small" x="372" y="160">skip</text><text class="label left" x="40" y="210">answer[2] = left × right = 6 × 5 = 30   (no division, so a 0 elsewhere is harmless)</text></svg>
<figcaption>Every answer is a left part times a right part around a hole. The left parts of all indexes are one running product from the left; the right parts are one running product from the right.</figcaption>
