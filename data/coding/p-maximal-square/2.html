
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>matrix</code></th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>["01110","11111","01111","00110"]</code></td><td><b>9</b></td><td>Rows 0-2, columns 1-3 are all 1: side 3, area 9.</td></tr>
