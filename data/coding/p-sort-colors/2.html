<svg viewBox="0 0 730 210" role="img" aria-label="The array split into four zones: 0s, 1s, unknown, 2s, with pointers lo, mid and hi at the zone borders"><rect class="box fail" x="60" y="60" width="140" height="56"/><text class="label" x="130" y="88">0s (red)</text><rect class="box plain" x="206" y="60" width="140" height="56"/><text class="label" x="276" y="88">1s (white)</text><rect class="box ghost" x="352" y="60" width="210" height="56"/><text class="label" x="457" y="88">unknown</text><rect class="box k8s" x="568" y="60" width="140" height="56"/><text class="label" x="638" y="88">2s (blue)</text><text class="label ok" x="206" y="146">lo</text><text class="label kafka" x="352" y="146">mid</text><text class="label k8s" x="534" y="146">hi</text><text class="label small left" x="60" y="186">[0, lo) all 0  ·  [lo, mid) all 1  ·  [mid, hi] not seen  ·  (hi, n) all 2</text><text class="label small left" x="60" y="34">every step moves one value out of the unknown zone, so the loop runs at most n times</text></svg>
