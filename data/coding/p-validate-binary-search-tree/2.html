
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>root</code></th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[20,10,30]</code></td><td><b>true</b></td><td>10 &lt; 20 &lt; 30 and both children are leaves.</td></tr>
      <tr><td><code>[20,10,30,null,null,15,40]</code></td><td><b>false</b></td><td>15 is the left child of 30, so locally fine, but it sits in 20's right subtree and 15 &lt; 20.</td></tr>
      <tr><td><code>[7,7]</code></td><td><b>false</b></td><td>Equal keys are not allowed on either side: "strictly" smaller / larger.</td></tr>
    </tbody>
  </table></div>
