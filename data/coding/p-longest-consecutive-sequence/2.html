
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>nums</code></th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[52,9,50,11,51,10,8,300]</code></td><td><b>4</b></td><td>Runs: 8,9,10,11 (length 4), 50,51,52 (length 3), 300 (length 1).</td></tr>
      <tr><td><code>[5,0,-1,3,2,5,1,4]</code></td><td><b>7</b></td><td>-1,0,1,2,3,4,5. The duplicate 5 is counted once; negatives are fine.</td></tr>
      <tr><td><code>[]</code></td><td><b>0</b></td><td>No values, no run.</td></tr>
    </tbody>
  </table></div>
  <figure class="diagram">
<svg viewBox="0 0 800 260" role="img" aria-label="Three runs of consecutive values, 8 to 11, 50 to 52 and 300, with the first value of each run marked as a start"><text class="label small" x="400" y="28">nums = [52,9,50,11,51,10,8,300] put in a set, then grouped into runs</text><rect class="box ok" x="40" y="70" width="64" height="48"/><text class="label" x="72" y="100">8</text><rect class="box cache" x="118" y="70" width="64" height="48"/><text class="label" x="150" y="100">9</text><line class="arrow" x1="104" y1="94" x2="116" y2="94"/><rect class="box cache" x="196" y="70" width="64" height="48"/><text class="label" x="228" y="100">10</text><line class="arrow" x1="182" y1="94" x2="194" y2="94"/><rect class="box cache" x="274" y="70" width="64" height="48"/><text class="label" x="306" y="100">11</text><line class="arrow" x1="260" y1="94" x2="272" y2="94"/><text class="label small left" x="72" y="150">start: 7 not in set</text><text class="label small left" x="72" y="172">run length 4</text><rect class="box ok" x="382" y="70" width="64" height="48"/><text class="label" x="414" y="100">50</text><rect class="box cache" x="460" y="70" width="64" height="48"/><text class="label" x="492" y="100">51</text><line class="arrow" x1="446" y1="94" x2="458" y2="94"/><rect class="box cache" x="538" y="70" width="64" height="48"/><text class="label" x="570" y="100">52</text><line class="arrow" x1="524" y1="94" x2="536" y2="94"/><text class="label small left" x="414" y="150">start: 49 not in set</text><text class="label small left" x="414" y="172">run length 3</text><rect class="box ok" x="646" y="70" width="64" height="48"/><text class="label" x="678" y="100">300</text><text class="label small left" x="678" y="150">start: 299 not in set</text><text class="label small left" x="678" y="172">run length 1</text><text class="label small" x="400" y="230">Only a start (green) begins a count, so each value is visited O(1) times: O(n) overall.</text></svg>
<figcaption>A value starts a run only when <code>x - 1</code> is not in the set (green). Counting up from the starts finds the runs 8..11 (length 4, the answer), 50..52 and 300 without re-walking any run.</figcaption>
</figure>
