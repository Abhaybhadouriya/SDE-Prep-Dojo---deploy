
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>digits</code></th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[4,0,7]</code></td><td><b>[4,0,8]</b></td><td>407 + 1 = 408. The last digit is not 9, so it is the only one that changes.</td></tr>
      <tr><td><code>[2,9,9]</code></td><td><b>[3,0,0]</b></td><td>299 + 1 = 300. Both 9s roll over; the 2 absorbs the carry.</td></tr>
      <tr><td><code>[9,9,9,9]</code></td><td><b>[1,0,0,0,0]</b></td><td>9999 + 1 = 10000. Every digit rolls over, so the result has one more digit.</td></tr>
    </tbody>
  </table></div>
