
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>s</code></th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>"abaab"</code></td><td><b>"baab"</b></td><td>"aba" (odd, centre on index 1) has length 3, but "baab" (even, centre between indexes 2 and 3) has length 4.</td></tr>
      <tr><td><code>"nonoz"</code></td><td><b>"non"</b></td><td>"ono" is just as long; either is accepted.</td></tr>
      <tr><td><code>"pqrs"</code></td><td><b>"p"</b></td><td>No two letters match; any single character is a palindrome of length 1.</td></tr>
    </tbody>
  </table></div>
