
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>nums</code></th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[5,5,8]</code></td><td><b>8</b></td><td>5 ^ 5 = 0, then 0 ^ 8 = 8.</td></tr>
      <tr><td><code>[7,3,9,3,7]</code></td><td><b>9</b></td><td>The pairs (7,7) and (3,3) are not next to each other; order does not matter for XOR.</td></tr>
      <tr><td><code>[-4]</code></td><td><b>-4</b></td><td>A single element is its own answer.</td></tr>
      <tr><td><code>[0,6,6]</code></td><td><b>0</b></td><td>The answer can be 0, so do not use 0 as a "not found" marker.</td></tr>
    </tbody>
  </table></div>
