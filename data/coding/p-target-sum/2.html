
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input</th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>nums = [2,2,2,2], target = 4</code></td><td><code>4</code></td><td>Exactly one 2 gets '-' (2 + 2 + 2 - 2 = 4), and there are 4 choices for which one.</td></tr>
      <tr><td><code>nums = [3,1,4], target = 2</code></td><td><code>1</code></td><td>Only -3 + 1 + 4 = 2.</td></tr>
      <tr><td><code>nums = [0,0,1], target = 1</code></td><td><code>4</code></td><td>+1 is forced; each 0 can be +0 or -0, and those count as different: 2 x 2 = 4.</td></tr>
    </tbody>
  </table></div>
