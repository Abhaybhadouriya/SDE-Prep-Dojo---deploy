
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input head</th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[3,7,7,3]</code></td><td><code>true</code></td><td>Even length: 3 = 3 and 7 = 7.</td></tr>
      <tr><td><code>[4,9]</code></td><td><code>false</code></td><td>4 ≠ 9.</td></tr>
      <tr><td><code>[5,0,8,0,5]</code></td><td><code>true</code></td><td>Odd length: the middle 8 mirrors itself and is never compared.</td></tr>
    </tbody>
  </table></div>
  <figure class="diagram">
<svg viewBox="0 0 800 220" role="img" aria-label="With the loop condition fast.next and fast.next.next, slow stops at the end of the front half for both even and odd lengths"><rect class="box cache" x="60" y="30" width="60" height="40"/><text class="label" x="90" y="50">3</text><rect class="box cache" x="150" y="30" width="60" height="40"/><text class="label" x="180" y="50">7</text><text class="label small ok" x="180" y="88">slow</text><rect class="box queue" x="240" y="30" width="60" height="40"/><text class="label" x="270" y="50">7</text><rect class="box queue" x="330" y="30" width="60" height="40"/><text class="label" x="360" y="50">3</text><text class="label small left" x="430" y="54">even: front 3 7 | back 7 3</text><rect class="box cache" x="60" y="130" width="60" height="40"/><text class="label" x="90" y="150">5</text><rect class="box cache" x="150" y="130" width="60" height="40"/><text class="label" x="180" y="150">0</text><rect class="box cache" x="240" y="130" width="60" height="40"/><text class="label" x="270" y="150">8</text><text class="label small ok" x="270" y="188">slow</text><rect class="box queue" x="330" y="130" width="60" height="40"/><text class="label" x="360" y="150">0</text><rect class="box queue" x="420" y="130" width="60" height="40"/><text class="label" x="450" y="150">5</text><text class="label small left" x="520" y="154">odd: front 5 0 8 | back 0 5</text></svg>
<figcaption>Loop while <code>fast.next</code> and <code>fast.next.next</code> exist: <code>slow</code> stops on the last node of the front half. The back half (after slow) is never longer, so it controls the comparison loop and the odd middle is skipped for free.</figcaption>
</figure>
