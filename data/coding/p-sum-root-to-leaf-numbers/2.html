
  <h2>Examples</h2>

    <tbody>
      <tr><td><code>[2,4,7]</code></td><td><b>51</b></td><td>Paths 2 -> 4 = 24 and 2 -> 7 = 27; 24 + 27 = 51.</td></tr>
