
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input</th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>nums = [1,0]</code></td><td><code>2</code></td><td>The whole log has one 1 and one 0.</td></tr>
      <tr><td><code>nums = [1,1,0]</code></td><td><code>2</code></td><td><code>[1,0]</code> at indices 1-2. The whole array has two 1s, so it does not count.</td></tr>
      <tr><td><code>nums = [0,0,1,0,1,1,1]</code></td><td><code>6</code></td><td><code>[0,0,1,0,1,1]</code> (indices 0-5): three of each. Shorter balanced runs such as [0,1] exist; we need the longest.</td></tr>
    </tbody>
  </table></div>
  <figure class="diagram">
<svg viewBox="0 0 800 290" role="img" aria-label="Balance walk of 0,0,1,0,1,1,1: a 1 steps up, a 0 steps down; the walk is at height 0 at the start and after index 5"><line class="line" x1="70" y1="110" x2="720" y2="110" style="opacity:.35"/><text class="label small" x="40" y="115">1</text><line class="line" x1="70" y1="150" x2="720" y2="150" style="opacity:.35"/><text class="label small" x="40" y="155">0</text><line class="line" x1="70" y1="190" x2="720" y2="190" style="opacity:.35"/><text class="label small" x="40" y="195">-1</text><line class="line" x1="70" y1="230" x2="720" y2="230" style="opacity:.35"/><text class="label small" x="40" y="235">-2</text><text class="label small" x="40" y="84">bal</text><polyline class="arrow none accent" points="80,150 170,190 260,230 350,190 440,230 530,190 620,150 710,110"/><line class="arrow none ok dashed" x1="80" y1="150" x2="620" y2="150"/><text class="label ok" x="350" y="140">same height 0: nums[0..5] balanced, length 6</text><circle class="box ok" cx="80" cy="150" r="7"/><text class="label small" x="80" y="272">start</text><circle class="box plain" cx="170" cy="190" r="7"/><text class="label small" x="170" y="272">0</text><text class="label mono" x="170" y="252">0</text><circle class="box plain" cx="260" cy="230" r="7"/><text class="label small" x="260" y="272">1</text><text class="label mono" x="260" y="252">0</text><circle class="box plain" cx="350" cy="190" r="7"/><text class="label small" x="350" y="272">2</text><text class="label mono" x="350" y="252">1</text><circle class="box plain" cx="440" cy="230" r="7"/><text class="label small" x="440" y="272">3</text><text class="label mono" x="440" y="252">0</text><circle class="box plain" cx="530" cy="190" r="7"/><text class="label small" x="530" y="272">4</text><text class="label mono" x="530" y="252">1</text><circle class="box ok" cx="620" cy="150" r="7"/><text class="label small" x="620" y="272">5</text><text class="label mono" x="620" y="252">1</text><circle class="box plain" cx="710" cy="110" r="7"/><text class="label small" x="710" y="272">6</text><text class="label mono" x="710" y="252">1</text><text class="label small left" x="30" y="252">nums</text><text class="label small left" x="30" y="272">index</text></svg>
<figcaption>Walk along the array: a 1 is a step up, a 0 a step down. Two points at the same height enclose as many ups as downs, so the stretch between them has equal 0s and 1s. The longest such stretch joins the FIRST and the LAST visit of one height.</figcaption>
