
  <h2>Edge cases</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input</th><th>Expected</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[1]</code></td><td>0</td><td>One element can never be balanced.</td></tr>
      <tr><td><code>[0,0,0]</code></td><td>0</td><td>The balance only falls; no value repeats.</td></tr>
      <tr><td><code>[0,1]</code></td><td>2</td><td>Needs the seed first[0] = -1.</td></tr>
      <tr><td><code>[1,1,1,0,0,1,1]</code></td><td>4</td><td>The best run is in the middle, not a prefix.</td></tr>
      <tr><td>10<sup>5</sup> alternating 1,0</td><td>100000</td><td>Answer can be n; it is always even.</td></tr>
    </tbody>
  </table></div>
