
<h2>Edge cases</h2>
<div class="table-wrap"><table class="table">
<thead><tr><th>Input</th><th>Expected</th><th>Why it matters</th></tr></thead>
<tbody>
<tr><td><code>[0, 0, 0]</code></td><td><code>0</code></td><td>No 1 at all; best starts at 0, not 1.</td></tr>
<tr><td><code>[1, 1, 1, 1]</code></td><td><code>4</code></td><td>No 0 ever "closes" the run: update best on every 1.</td></tr>
<tr><td><code>[1]</code> / <code>[0]</code></td><td><code>1</code> / <code>0</code></td><td>Smallest input (n &gt;= 1).</td></tr>
<tr><td>Best block at the very start</td><td>its length</td><td>best is kept separately, so later shorter runs do not overwrite it.</td></tr>
</tbody></table></div>
