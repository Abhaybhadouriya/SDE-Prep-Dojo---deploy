
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th><code>nums</code></th><th><code>target</code></th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[4,-3,0,7,-6]</code></td><td>6</td><td><code>5</code></td><td>-6 + 4 + 7 = 5 is 1 away. The next best are -3 + 0 + 7 = 4 and -3 + 4 + 7 = 8, both 2 away.</td></tr>
      <tr><td><code>[1,1,1]</code></td><td>-2</td><td><code>3</code></td><td>Only one triplet exists; it is the answer however far it is.</td></tr>
      <tr><td><code>[-2,0,3,5,8]</code></td><td>6</td><td><code>6</code></td><td>-2 + 3 + 5 hits the target exactly, distance 0: we can return at once.</td></tr>
    </tbody>
  </table></div>
