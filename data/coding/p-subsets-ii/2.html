
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input</th><th>Output (any order)</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[3,1,3]</code></td><td><code>[[],[1],[1,3],[1,3,3],[3],[3,3]]</code></td><td>Index choices {0} and {2} both give [3]; it appears once. 6 = (1+1) x (2+1).</td></tr>
      <tr><td><code>[-2]</code></td><td><code>[[],[-2]]</code></td><td>One element: the empty set and itself.</td></tr>
      <tr><td><code>[5,5,5]</code></td><td><code>[[],[5],[5,5],[5,5,5]]</code></td><td>All equal: only the number of 5s varies, so 4 subsets, not 8.</td></tr>
    </tbody>
  </table></div>
