
<h2>Edge cases</h2>
<div class="table-wrap"><table class="table">
<thead><tr><th>Input</th><th>Expected</th><th>Why it matters</th></tr></thead>
<tbody>
<tr><td><code>"", ""</code></td><td>0</td><td>Both empty: the table is one cell.</td></tr>
<tr><td><code>"", "abc"</code></td><td>3</td><td>Only inserts: the base row.</td></tr>
<tr><td><code>"abc", ""</code></td><td>3</td><td>Only deletes: the loop must still return i, not 0.</td></tr>
<tr><td><code>"same", "same"</code></td><td>0</td><td>All diagonals are matches.</td></tr>
<tr><td>500 × a, 500 × b</td><td>500</td><td>Largest input: 250,000 cells, 500 replaces.</td></tr>
</tbody></table></div>
