
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>s</code></th><th>Output (one valid answer)</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>"co(d(e)r)s)"</code></td><td><code>"co(d(e)r)s"</code></td><td>Only one ')' is extra. Removing the ')' after <code>r</code> instead gives <code>"co(d(e)rs)"</code>, which is also accepted.</td></tr>
      <tr><td><code>"x)y(z)w"</code></td><td><code>"xy(z)w"</code></td><td>The first ')' comes before any '('.</td></tr>
      <tr><td><code>"))a(("</code></td><td><code>"a"</code></td><td>No bracket can be matched; only the letter survives.</td></tr>
    </tbody>
  </table></div>
