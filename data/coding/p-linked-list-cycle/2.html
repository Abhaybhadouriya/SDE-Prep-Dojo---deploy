
<h2>Examples</h2>
<div class="table-wrap"><table class="table">
<thead><tr><th>Input</th><th>Output</th><th>Why</th></tr></thead>
<tbody>
<tr><td><code>values = [4,9,2,7,5], pos = 1</code></td><td><code>true</code></td><td>5's next is 9, so 9 → 2 → 7 → 5 → 9 repeats.</td></tr>
<tr><td><code>values = [6,6], pos = 0</code></td><td><code>true</code></td><td>The second 6 points back to the first: a 2-node loop.</td></tr>
<tr><td><code>values = [8], pos = -1</code></td><td><code>false</code></td><td>One node whose next is null.</td></tr>
</tbody></table></div>
