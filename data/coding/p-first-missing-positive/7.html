
  <h2>Edge cases</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input</th><th>Expected</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[1]</code></td><td><code>2</code></td><td>All of 1..n present: the answer is n + 1.</td></tr>
      <tr><td><code>[1,1]</code></td><td><code>2</code></td><td>Duplicates: the value guard stops the swap loop.</td></tr>
      <tr><td><code>[2147483647, -2147483648]</code></td><td><code>1</code></td><td>Extremes are out of range and never used as an index or added to.</td></tr>
      <tr><td><code>[-5,-1]</code></td><td><code>1</code></td><td>No positives at all.</td></tr>
      <tr><td><code>[3,4,2,1]</code></td><td><code>5</code></td><td>A full permutation of 1..n.</td></tr>
    </tbody>
  </table></div>
