
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>nums</code></th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[2,0,1]</code></td><td><code>3</code></td><td>1 and 2 are present, 0 is not positive. n = 3 and 1..2 are filled, so 3 is next.</td></tr>
      <tr><td><code>[4,-2,1,3]</code></td><td><code>2</code></td><td>1 is there, 2 is not. Negatives never matter.</td></tr>
      <tr><td><code>[6,9,10,13]</code></td><td><code>1</code></td><td>Every value is larger than n = 4, so none can fill the slots 1..4; 1 itself is missing.</td></tr>
    </tbody>
  </table></div>
