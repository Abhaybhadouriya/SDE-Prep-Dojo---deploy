
<h2>Examples</h2>
<div class="table-wrap"><table class="table">
<thead><tr><th>Input</th><th>Output</th><th>Why</th></tr></thead>
<tbody>
<tr><td><code>nums = [3,8,4,1]</code></td><td><code>9</code></td><td>Open lockers 1 and 3: 8 + 1. (3 + 4 = 7 is less.)</td></tr>
<tr><td><code>nums = [6,1,2,9,4]</code></td><td><code>15</code></td><td>Open lockers 0 and 3: 6 + 9. Taking 6 + 2 + 4 = 12 is the "every other one" trap.</td></tr>
<tr><td><code>nums = [4,1,1,4]</code></td><td><code>8</code></td><td>Lockers 0 and 3 are not adjacent: the gap between picks can be 2 or more.</td></tr>
</tbody></table></div>
