
  <h2>Edge cases</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input</th><th>Expected</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>"q"</code></td><td>[["q"]]</td><td>n = 1: one partition.</td></tr>
      <tr><td><code>"abc"</code></td><td>[["a","b","c"]]</td><td>No two-letter palindrome: only single letters.</td></tr>
      <tr><td><code>"kkk"</code></td><td>4 partitions</td><td>k|k|k, k|kk, kk|k, kkk: every gap is free.</td></tr>
      <tr><td><code>"aaaaaaaaaaaaaaaa"</code> (16)</td><td>32,768 partitions</td><td>The worst case: 2<sup>15</sup> answers, memory for the output dominates.</td></tr>
    </tbody>
  </table></div>
