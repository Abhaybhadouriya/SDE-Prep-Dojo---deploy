
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input</th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[3,8,4,7]</code></td><td><code>true</code></td><td>Total 22, half 11: {3, 8} and {4, 7} both sum to 11.</td></tr>
      <tr><td><code>[2,4,9]</code></td><td><code>false</code></td><td>Total 15 is odd, so two equal integer halves are impossible.</td></tr>
      <tr><td><code>[1,1,1,9]</code></td><td><code>false</code></td><td>Total 12 is even, but half = 6 cannot be made: 9 is too big and 1 + 1 + 1 = 3. Even total is necessary, not sufficient.</td></tr>
    </tbody>
  </table></div>
