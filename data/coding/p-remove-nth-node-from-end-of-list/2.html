
<h2>Examples</h2>
<div class="table-wrap"><table class="table">
<thead><tr><th>Input</th><th>Output</th><th>Why</th></tr></thead>
<tbody>
<tr><td><code>head = [10,20,30,40,50,60], n = 2</code></td><td><code>[10,20,30,40,60]</code></td><td>From the end: 60 is 1st, 50 is 2nd, so 50 goes.</td></tr>
<tr><td><code>head = [8], n = 1</code></td><td><code>[]</code></td><td>The only node is removed; return null.</td></tr>
<tr><td><code>head = [3,4], n = 2</code></td><td><code>[4]</code></td><td>n equals the length, so the head itself is deleted and 4 becomes the new head.</td></tr>
</tbody></table></div>
