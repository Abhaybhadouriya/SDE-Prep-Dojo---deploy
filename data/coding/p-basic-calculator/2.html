
  <h2>Examples</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input <code>s</code></th><th>Output</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>" 4 - 6 + 10 "</code></td><td><code>8</code></td><td>Left to right: 4 - 6 = -2, -2 + 10 = 8. Spaces are ignored.</td></tr>
      <tr><td><code>"7-(3-(2+1))+2"</code></td><td><code>9</code></td><td>Inner bracket 2+1 = 3, then 3-3 = 0, then 7-0+2 = 9.</td></tr>
      <tr><td><code>"-(4+5)"</code></td><td><code>-9</code></td><td>Unary minus in front of a bracket negates the whole bracket.</td></tr>
    </tbody>
  </table></div>
