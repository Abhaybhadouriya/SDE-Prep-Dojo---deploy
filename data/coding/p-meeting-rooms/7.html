
  <h2>Edge cases</h2>
  <div class="table-wrap"><table class="table">
    <thead><tr><th>Input</th><th>Expected</th><th>Why</th></tr></thead>
    <tbody>
      <tr><td><code>[]</code></td><td>true</td><td>Empty list; the loop from index 1 does nothing.</td></tr>
      <tr><td><code>[[3, 8]]</code></td><td>true</td><td>One meeting.</td></tr>
      <tr><td><code>[[5, 9], [9, 12]]</code></td><td>true</td><td>Touching ends are not an overlap.</td></tr>
      <tr><td><code>[[1, 20], [5, 6]]</code></td><td>false</td><td>Nested meeting: caught because 5 &lt; 20.</td></tr>
      <tr><td><code>[[4, 6], [4, 6]]</code></td><td>false</td><td>Identical meetings; same start is a clash.</td></tr>
    </tbody>
  </table></div>
