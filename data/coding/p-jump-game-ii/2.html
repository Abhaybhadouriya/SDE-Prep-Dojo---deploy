
<h2>Examples</h2>
<div class="table-wrap"><table class="table">
<thead><tr><th>Input</th><th>Output</th><th>Why</th></tr></thead>
<tbody>
<tr><td><code>nums = [2,1,3,1,1,1,2]</code></td><td><code>3</code></td><td>0 -&gt; 2 -&gt; 5 -&gt; 6. From pad 0 you reach at most pad 2, from there at most pad 5: two hops cannot reach pad 6.</td></tr>
<tr><td><code>nums = [2,4,0,1,3]</code></td><td><code>2</code></td><td>0 -&gt; 1 -&gt; 4. Hopping to pad 2 (the farthest first hop) would strand you on a 0.</td></tr>
<tr><td><code>nums = [6]</code></td><td><code>0</code></td><td>Already on the last pad.</td></tr>
</tbody></table></div>
