
<h2>Examples</h2>
<div class="table-wrap"><table class="table">
<thead><tr><th>Input</th><th>Output</th><th>Why</th></tr></thead>
<tbody>
<tr><td><code>s = "xyzzyx", p = "xyz"</code></td><td><code>[0, 3]</code></td><td>"xyz" at 0 and "zyx" at 3. "yzz" and "zzy" have two z.</td></tr>
<tr><td><code>s = "aaaa", p = "aa"</code></td><td><code>[0, 1, 2]</code></td><td>Matches overlap: every length-2 window is "aa".</td></tr>
<tr><td><code>s = "ab", p = "abc"</code></td><td><code>[]</code></td><td>p is longer than s: no window fits.</td></tr>
</tbody></table></div>
